<style>
/*!
 * Theme modal — opened when a Theme card is clicked. Two columns:
 * a rubric grid (criteria rows x 4 fixed levels) on the left, and a
 * Grade badge + Evidence container on the right.
 *
 * Structure note: on the side-by-side (desktop/tablet) layout,
 * `.theme-modal-scroll` itself no longer scrolls — it's a column flexbox
 * (header, then body) capped at the modal's own max-height. Only
 * `.rubric-col` scrolls internally now; `.theme-modal-header` and
 * `.modal-sidebar-col` (Grade dropdown + Evidence) just sit at their
 * natural place in that column and never move, however long the rubric
 * gets or however far it's scrolled. This was a deliberate change from
 * an earlier version where `.theme-modal-scroll` was the one scrolling
 * element for header+body together (header merely `position: sticky` to
 * stay visually put) — that made the Grade/Evidence sidebar scroll away
 * with a long rubric, which is exactly what shouldn't happen: the
 * visitor should always be able to see/change the grade and add evidence
 * without hunting for them. `min-height: 0` on the flex chain
 * (`.theme-modal-scroll` → `.theme-modal-body` → `.rubric-col`) is what
 * makes a flex child capable of scrolling internally instead of just
 * growing past its box — the same trick `.evidence-container` /
 * `.evidence-list-scroll` already used below it.
 *
 * The narrow/stacked breakpoint (≤760px) deliberately keeps the OLD
 * single-scroll behaviour instead (see the responsive section at the
 * bottom): once rubric and sidebar stack into one column there's no
 * side-by-side split left to make sticky, and a normal one long
 * scrolling page reads better on a phone than a pinned sidebar eating
 * screen height above a short rubric viewport.
 *
 * The Evidence container (`.evidence-container`) has two mutually
 * exclusive views, toggled in the demo script: the accordion list
 * (`.evidence-accordion-item`, one open at a time) and the compose form
 * (`.evidence-compose`, shown while adding new evidence — a textarea,
 * staged attachment chips, and Attach/Cancel/Submit). Its height
 * matches the rubric column's via `align-items: stretch` on
 * `.theme-modal-body` plus `flex: 1` on the container itself, so it's
 * never fighting the rubric's own natural height; the narrow-screen
 * breakpoint (where the layout stacks and there's no rubric column
 * beside it to match) gives it an explicit default height instead.
 *
 * Rubric cells show selection via border colour + a light background
 * tint only — no separate checkbox/tick element.
 *
 * One accent colour — the selected Element's own wheel colour,
 * --modal-accent / --modal-accent-rgb, set inline by openThemeModal()
 * in the demo script — runs through the rubric (current-grade column
 * header, selected cells) and the Evidence container's buttons (Add
 * Evidence, Submit). The Grade badge is the one exception: it's
 * coloured by the GRADE itself (--grade-color, one of the GRADES
 * colours), not the Element, per your "Pre-Delivering = red"
 * instruction, and fades between colours when the grade changes. The
 * grade dropdown's items are centred and also hover to their own
 * grade's colour (--item-color, set per item), not a flat neutral hover.
 *
 * Depends on nothing but its own rules below; safe to drop next to
 * excellence-wheel.css / theme-cards.css in any page that renders them.
 */

.theme-modal-overlay {
  position: fixed;
  inset: 0;
  /* Transparent, not dimmed (neubrutalism: the modal's black outline
     separates it from the page). It still covers the page so a click
     outside the modal closes it. */
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.theme-modal-overlay.is-open {
  opacity: 1;
  pointer-events: auto;
}

.theme-modal {
  position: relative;
  width: 100%;
  max-width: 1180px;
  max-height: calc(100vh - 48px);
  box-sizing: border-box;
  background: #ffffff;
  border: 2.5px solid #000000; /* black outline only, like the main container */
  border-radius: 36px;
  transform: translateY(14px) scale(0.98);
  transition: transform 0.22s ease;
  overflow: hidden; /* clips .theme-modal-scroll's corners to match */
}

.theme-modal-overlay.is-open .theme-modal {
  transform: translateY(0) scale(1);
}

.theme-modal-scroll {
  max-height: calc(100vh - 48px);
  /* Column flex, not a scroller itself on this (desktop/tablet) tier —
     see the file-header comment above. overflow: hidden here is what
     actually caps it at max-height instead of growing past it; .rubric-col
     below is the one part that scrolls when content doesn't fit. */
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 34px; /* explicit, not just inherited via the parent's overflow:hidden — keeps the corners round even where a scrollbar sits right at the edge */
}

.theme-modal-header {
  /* No longer position: sticky — .theme-modal-scroll doesn't scroll on
     this tier, so the header just sits at the top of the column, always
     visible, with nothing to stick against. Still position: sticky at
     the ≤760px breakpoint below, where the old single-scroll behaviour
     returns. */
  flex: none;
  z-index: 2;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 84px;
  box-sizing: border-box;
  padding: 18px 76px; /* room for the close button either side, so the title stays centred */
  border-bottom: 2.5px solid #000000;
  background: #ffffff;
}

.theme-modal-title {
  margin: 0;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-weight: 800;
  font-size: 24px;
  line-height: 1.25;
  text-align: center;
  color: #000000;
}

.theme-modal-close {
  position: absolute;
  top: 50%;
  right: 24px;
  margin-top: -16px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: #f1f2f6;
  color: #3a3c47;
  font-size: 18px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s ease;
  flex: none;
}

.theme-modal-close:hover,
.theme-modal-close:focus-visible {
  background: #e3e5ee;
}

.theme-modal-body {
  display: flex;
  /* flex-wrap: wrap used to live here ("if the sidebar genuinely can't fit
     beside the rubric, it drops below automatically") but a wrapping flex
     container sizes its (single, non-wrapped in practice — see the
     ≤760px breakpoint below, which already owns the real narrow case)
     line to its content's own height rather than the container's, which
     defeated align-items: stretch below and let .rubric-col/
     .modal-sidebar-col grow past .theme-modal-scroll's max-height cap
     instead of being clipped to it. Dropped in favour of the explicit
     breakpoint doing that job instead. */
  flex: 1 1 auto; /* fills whatever's left of .theme-modal-scroll's column below the header, up to its max-height cap */
  min-height: 0; /* lets this shrink below its content's natural height instead of pushing .theme-modal-scroll past max-height — required for .rubric-col below to actually get a bounded height to scroll within */
  overflow: hidden; /* .rubric-col does the actual scrolling; this just stops its content from spilling past the capped box */
  gap: 32px;
  padding: 26px 32px 32px;
  align-items: stretch; /* sidebar column stretches to match the rubric column's height, when they're on the same line */
}

/* Rubric ---------------------------------------------------------------- */

.rubric-col {
  flex: 1 1 480px;
  min-width: 340px; /* was 0 — that's the actual bug: it let this column shrink smaller than its grid's own 4x160px+gaps content size, so the grid overflowed sideways under the sidebar instead of the column just refusing to shrink further */
  min-height: 0; /* same flex-shrink trick as above — without it this column just grows to its grid's full height instead of respecting the row's stretched (capped) height */
  overflow-y: auto;
  /* Bottom padding so the last rubric row's focus/hover state and shadow
     band aren't flush against (or clipped by) the scroll edge. */
  padding-bottom: 4px;
}

.rubric-header,
.rubric-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(130px, 1fr));
  gap: 20px; /* wider than a plain grid needs — leaves room for the selected cell's shadow band to actually show against the row below it, not be covered by it */
}

.rubric-header {
  margin-bottom: 10px;
}

.rubric-header-cell {
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: clamp(10.5px, 1.05vw, 12px);
  font-weight: 600;
  color: #90939e;
  padding: 0 2px;
}

.rubric-header-cell.is-current {
  color: var(--modal-accent, #1c1f4f);
  font-weight: 700;
}

.rubric-cell {
  position: relative;
  border: 1.5px solid #e5e7ee;
  border-radius: 10px;
  background: #ffffff;
  padding: 12px;
  min-height: 92px;
  box-sizing: border-box;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: clamp(10.5px, 1.05vw, 12px); /* gently shrinks as the viewport (and so the rubric column) narrows, rather than a hard jump at one breakpoint */
  line-height: 1.55;
  color: #6a6d7a;
  cursor: pointer;
  outline: none;
  box-shadow: 0 3px 0 0 #e5e7ee;
  transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
}

.rubric-cell:hover,
.rubric-cell:focus-visible {
  border-color: var(--modal-accent, #1c1f4f);
}

.rubric-cell.is-selected {
  border-color: var(--modal-accent, #1c1f4f);
  background: rgba(var(--modal-accent-rgb, 28, 31, 79), 0.05);
  color: #2a2c38;
  box-shadow: 0 3px 0 0 var(--modal-shadow, #1c1f4f);
}

.rubric-cell:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 0 #e5e7ee;
}

.rubric-cell.is-selected:active {
  box-shadow: 0 1px 0 0 var(--modal-shadow, #1c1f4f);
}

.rubric-cell.is-blank {
  background: #f7f7fa;
  border-color: #f7f7fa;
  cursor: default;
  pointer-events: none;
  box-shadow: none;
}

/* Mobile-only level label inside each cell — hidden on the grid layout,
   shown once the rubric collapses to a single stacked column (below). */
.rubric-cell-level {
  display: none;
}

/* Sidebar: Grade + Evidence ---------------------------------------------- */

.modal-sidebar-col {
  flex: 1 1 260px;
  max-width: 300px;
  min-width: 220px;
  display: flex;
  flex-direction: column;
}

.sidebar-label {
  margin: 0 0 8px;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: #90939e;
  flex: none;
}

.grade-badge-wrap {
  position: relative;
  margin-bottom: 30px; /* room for the badge's shadow */
  flex: none;
}

.grade-badge {
  width: 100%;
  border: 2.5px solid #000000;
  border-radius: 8px;
  padding: 12px 16px;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 17px;
  font-weight: 800;
  color: #ffffff;
  background: var(--grade-color, #9aa0a6);
  box-shadow: 6px 6px 0 0 #000000;
  transition: background-color 0.35s ease, box-shadow 0.1s ease, transform 0.1s ease;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-sizing: border-box;
}

.grade-badge:active {
  transform: translate(4px, 4px);
  box-shadow: 2px 2px 0 0 #000000;
}

.grade-badge-arrow {
  width: 10px;
  height: 10px;
  flex: none;
  transition: transform 0.15s ease;
}

.grade-badge-wrap.is-open .grade-badge-arrow {
  transform: rotate(180deg);
}

.grade-dropdown {
  position: absolute;
  top: calc(100% + 14px); /* clear of the badge's 6px shadow */
  left: 0;
  right: 0;
  background: #ffffff;
  border: 2.5px solid #000000;
  border-radius: 8px;
  box-shadow: 6px 6px 0 0 #000000;
  overflow: hidden;
  z-index: 5;
  display: none;
}

.grade-badge-wrap.is-open .grade-dropdown {
  display: block;
}

.grade-dropdown-item {
  padding: 10px 14px;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: #2a2c38;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.15s ease, color 0.15s ease;
}

.grade-dropdown-item:hover {
  background: var(--item-color, #f4f5f9);
  color: #ffffff;
}

.grade-dropdown-item.is-current {
  background: #f0f1f7;
}

/* Evidence container -------------------------------------------------------
   Everything under the Grade badge is one container with two mutually
   exclusive views: the accordion list (default) and the compose form
   (while adding new evidence). It grows to fill whatever height
   .modal-sidebar-col stretched to (matching the rubric column) via
   flex: 1 — see the narrow-screen fallback height at the bottom of this
   file for when there's no rubric column beside it to match. */

.evidence-container {
  flex: 1 1 auto;
  min-height: 0; /* required for the child scroll area to actually scroll instead of overflowing */
  display: flex;
  flex-direction: column;
}

.evidence-list-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  margin-bottom: 12px;
}

.evidence-empty {
  margin: 0;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 12.5px;
  font-style: italic;
  color: #a3a6b0;
}

.evidence-add-btn {
  flex: none;
  width: calc(100% - 6px); /* leaves room for the shadow inside the column */
  border: 2.5px solid #000000;
  border-radius: 8px;
  padding: 12px 16px;
  background: #000000;
  color: #ffffff;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
  box-sizing: border-box;
  box-shadow: 6px 6px 0 0 #b3b3b3;
  transition: box-shadow 0.1s ease, transform 0.1s ease;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
}

.evidence-add-btn:active {
  transform: translate(4px, 4px);
  box-shadow: 2px 2px 0 0 #b3b3b3;
}

.evidence-add-btn svg {
  width: 16px;
  height: 16px;
  flex: none;
}

/* Accordion --------------------------------------------------------------*/

.evidence-accordion-item {
  border: 1px solid #e5e7ee;
  border-radius: 10px;
  margin-bottom: 16px; /* was 10px — extra room for the shadow band below */
  overflow: hidden;
  box-shadow: 0 3px 0 0 #e5e7ee;
}

.evidence-accordion-item:last-child {
  margin-bottom: 0;
}

.evidence-accordion-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 14px;
  cursor: pointer;
  outline: none;
}

.evidence-accordion-header:hover,
.evidence-accordion-header:focus-visible {
  background: #f8f8fb;
}

.evidence-accordion-title {
  flex: 1 1 auto; /* pushes the attachment pill and chevron to the right */
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
}

/* The entry's title (or "Evidence N" for entries saved before titles
   existed). One line while closed; wraps in full once the entry is open. */
.evidence-accordion-number {
  font-size: 12.5px;
  font-weight: 700;
  color: #2a2c38;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.evidence-accordion-item.is-open .evidence-accordion-number {
  white-space: normal;
  overflow-wrap: anywhere;
}

.evidence-accordion-meta {
  font-size: 11px;
  color: #a3a6b0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Attachment count on an evidence entry: a black pill with a paperclip,
   the same as the Theme cards' evidence pill. */
.evidence-accordion-pill {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px 2px 6px;
  border-radius: 999px;
  background: #000000;
  color: #ffffff;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-weight: 800;
  font-size: 11px;
  line-height: 1.3;
}

.evidence-accordion-pill svg {
  width: 10px;
  height: 10px;
  flex: none;
}

.evidence-accordion-chevron {
  width: 10px;
  height: 10px;
  flex: none;
  transition: transform 0.15s ease;
  color: #a3a6b0;
}

.evidence-accordion-item.is-open .evidence-accordion-chevron {
  transform: rotate(180deg);
}

.evidence-accordion-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.25s ease;
}

.evidence-accordion-item.is-open .evidence-accordion-body {
  max-height: 480px; /* generous cap — real content is far shorter, this just enables the transition */
}

.evidence-accordion-body-inner {
  padding: 0 14px 14px;
}

.evidence-item-text {
  margin: 0 0 12px;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 12.5px;
  line-height: 1.6;
  color: #3d3f4a;
}

.evidence-attachments-label {
  margin: 0 0 8px;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 10.5px;
  font-weight: 600;
  color: #a3a6b0;
}

.evidence-item-actions {
  display: flex;
  justify-content: flex-end;
  gap: 16px;
  margin-top: 10px;
}

.evidence-edit-btn,
.evidence-delete-btn,
.evidence-retry-btn,
.evidence-discard-btn {
  border: none;
  background: none;
  padding: 0;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
}

.evidence-edit-btn,
.evidence-discard-btn {
  color: #6a6d7a;
}

.evidence-retry-btn {
  color: var(--modal-accent, #2E5AAC);
  font-weight: 700;
}

.evidence-retry-btn:hover,
.evidence-retry-btn:focus-visible {
  text-decoration: underline;
}

.evidence-edit-btn:hover,
.evidence-edit-btn:focus-visible,
.evidence-discard-btn:hover,
.evidence-discard-btn:focus-visible {
  color: #2a2c38;
  text-decoration: underline;
}

.evidence-delete-btn {
  color: #c94f4f;
}

.evidence-delete-btn:hover,
.evidence-delete-btn:focus-visible {
  text-decoration: underline;
}

.evidence-attachment {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border: 1px solid #e9eaf0;
  border-radius: 8px;
  padding: 8px 8px 8px 12px;
  margin-bottom: 10px;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 11.5px;
  color: #9a9da6;
  box-shadow: 0 2px 0 0 #e9eaf0;
}

.evidence-attachment:last-child {
  margin-bottom: 0;
}

/* File names stay on one line (full name in the tooltip) so a long name
   doesn't push everything else down. */
.evidence-attachment-name,
.evidence-staged-filename {
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.evidence-attachment-name {
  flex: 1 1 auto;
}

.evidence-attachment.is-pending {
  opacity: 0.6;
}

.evidence-attachment.is-error {
  border-color: #efc9c9;
  color: #c94f4f;
}

/* Background save status on an evidence entry */
.evidence-item-status {
  margin: 0 0 8px;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 11px;
  line-height: 1.45;
  color: #6a6d7a;
}

.evidence-item-status.is-error {
  color: #c94f4f;
}

.evidence-accordion-item.is-pending .evidence-accordion-meta,
.evidence-accordion-item.is-pending .evidence-item-status {
  animation: evidence-saving-pulse 1.4s ease-in-out infinite;
}

.evidence-accordion-item.is-failed .evidence-accordion-meta {
  color: #c94f4f;
}

@keyframes evidence-saving-pulse {
  50% { opacity: 0.45; }
}

.evidence-attachment-icon {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}

.evidence-attachment-icon svg {
  width: 13px;
  height: 13px;
}

/* Compose (add evidence) --------------------------------------------------*/

.evidence-compose {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.evidence-compose-label {
  flex: none;
  margin: 0 0 6px;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 10.5px;
  font-weight: 600;
  color: #a3a6b0;
}

.evidence-compose-title,
.evidence-compose-textarea {
  border: 2px solid #000000;
  border-radius: 8px;
  padding: 12px 14px;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 13px;
  line-height: 1.55;
  color: #2a2c38;
  outline: none;
  box-sizing: border-box;
  transition: border-color 0.15s ease;
}

.evidence-compose-title {
  flex: none;
  width: 100%;
  margin-bottom: 12px;
  font-weight: 600;
}

.evidence-compose-title:focus {
  box-shadow: 3px 3px 0 0 #000000;
}

.evidence-compose-textarea {
  flex: 1 1 auto;
  min-height: 90px;
  resize: none;
}

.evidence-compose-textarea:focus {
  box-shadow: 3px 3px 0 0 #000000;
}

.evidence-compose-attachments {
  flex: none;
  max-height: 140px;
  overflow-y: auto;
  margin-top: 10px;
}

.evidence-compose-attachments:empty {
  margin-top: 0;
}

.evidence-compose-error {
  flex: none;
  margin: 8px 0 0;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 11.5px;
  color: #c94f4f;
}

.evidence-staged-attachment {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border: 1px solid #e9eaf0;
  border-radius: 8px;
  padding: 7px 7px 7px 12px;
  margin-top: 10px;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 11.5px;
  color: #6a6d7a;
  box-shadow: 0 2px 0 0 #e9eaf0;
}

.evidence-staged-name {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  overflow-wrap: anywhere;
}

.evidence-staged-status {
  font-size: 10.5px;
  color: #8a8d99;
}

.evidence-staged-attachment.is-error {
  border-color: #efc9c9;
}

.evidence-staged-attachment.is-error .evidence-staged-status {
  color: #c94f4f;
}

.evidence-compose-notice {
  flex: none;
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  background: #f4f5f8;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 11.5px;
  line-height: 1.45;
  color: #4a4d5a;
}

.evidence-compose-notice p {
  margin: 0 0 6px;
}

.evidence-compose-notice p:last-child {
