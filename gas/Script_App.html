                selected: null,
                cells: {
                  "pre-delivering": "There is a lack of clarity and consistency in relation to the aims, processes, and accountabilities of moderation.",
                  "delivering": "Teachers are encouraged to engage in moderation activities designed to develop a common language around assessment and develop a common understanding of standards-referenced assessment. They share teaching and learning strategies to support students to achieve at higher grade levels and apply marking criteria consistently.",
                  "sustaining": "Teachers regularly engage in moderation activities. They are skilled in their understanding of standards referenced assessment  and their ability to apply marking criteria effectively and consistently. They have developed a common language around assessment which informs the development of teaching and learning strategies to support student learning progress  into higher grade levels. ",
                  "excelling": "Teachers customarily engage in moderation activities. They are highly skilled in their understanding of standards-referenced assessment and their ability to apply marking criteria effectively and consistently. They have developed a common language around assessment, which informs the collaborative development of teaching and learning strategies to support student learning progress into higher grade levels."
                }
              },  // L_AF_CTJ_Skill
              {
                selected: null,
                cells: {
                  "pre-delivering": "Teachers rarely analyse student progress and adjust their practice.",
                  "delivering": "Teachers mostly analyse student progress, but adjustments to practice in response to student achievement is inconsistent. ",
                  "sustaining": "Teachers analyse student progress and adjust their practice in response to student achievement.",
                  "excelling": "Teachers collaboratively analyse student progress and collectively adjust their practice in response to student achievement. "
                }
              }  // L_AF_CTJ_Analysis
            ],
            evidence: []
          }
        ]
      }
    };

    // =======================================================================
    // Persistence — Ratings + Evidence (see Code.gs and HANDOFF.md for the
    // sheet schema/design). ELEMENT_THEMES above is the fresh-install
    // default; loadSchoolState() below overwrites grade/rubric/evidence
    // in place, per theme, once we know which school this visitor belongs
    // to (see enterApp() in Script_LoginGate.html, which calls
    // window.onAppEntered()).
    // =======================================================================

    var THEME_BY_ID = {};
    Object.keys(ELEMENT_THEMES).forEach(function (segId) {
      (ELEMENT_THEMES[segId].themes || []).forEach(function (theme) {
        THEME_BY_ID[theme.id] = theme;
      });
    });

    var SCHOOL_NAME = '';
    // Element resources and team messages (Code.gs's getSiteContent()),
    // loaded once on entering the app. Messages are handled by
    // Script_Messages.html.
    var SITE_CONTENT = { resources: [], messages: [], dismissed: [] };
    var USER_EMAIL = '';
    var USER_NAME = '';
    // The school's restore count when its state was loaded (Code.gs's
    // getSchoolState()). Sent with every save; the server refuses saves
    // from a page loaded before the school was restored to an earlier
    // point, and the page then reloads (reloadAfterRestore()).
    var STATE_VERSION = 0;

    // Applies a school's saved {ratings, evidence} (see Code.gs's
    // getSchoolState()) onto ELEMENT_THEMES in place. Every theme is reset
    // to its default first (ungraded, nothing selected, no evidence, not a
    // priority), so reloading after a restore doesn't leave anything behind.
    function applySchoolState(state) {
      Object.keys(THEME_BY_ID).forEach(function (themeId) {
        var theme = THEME_BY_ID[themeId];
        theme.grade = 'ungraded';
        theme.rubric.forEach(function (row) { row.selected = null; });
        theme.evidence = [];
        theme.priority = false;
      });
      STATE_VERSION = state.stateVersion || 0;
      showLastUpdated(state.lastUpdated);
      Object.keys(state.ratings || {}).forEach(function (themeId) {
        var theme = THEME_BY_ID[themeId];
        if (!theme) return; // stale id from a since-removed theme — ignore, don't throw
        var saved = state.ratings[themeId];
        theme.grade = saved.grade || 'ungraded';
        theme.priority = saved.priority === true;
        (saved.rubric || []).forEach(function (selected, i) {
          if (theme.rubric[i]) theme.rubric[i].selected = selected || null;
        });
      });
      var byTheme = {};
      (state.evidence || []).forEach(function (entry) {
        (byTheme[entry.themeId] = byTheme[entry.themeId] || []).push(entry);
      });
      Object.keys(byTheme).forEach(function (themeId) {
        var theme = THEME_BY_ID[themeId];
        if (theme) theme.evidence = byTheme[themeId];
      });
    }

    function loadSchoolState(onLoaded, onError) {
      if (!SCHOOL_NAME) return;
      google.script.run
        .withSuccessHandler(function (state) {
          applySchoolState(state);
          updateDotRingColors();
          prioritiesChanged();
          // With no Element selected, the panel beside the wheel shows the
          // school's priorities; on first load this also opens that panel
          // (see expandDetail()).
          var selected = wheel && wheel.getSelected && wheel.getSelected();
          if (selected) renderElementDetail(selected);
          else renderPrioritiesView(expandDetail() ? 400 : 0);
          if (onLoaded) onLoaded();
        })
        .withFailureHandler(function (err) {
          console.error('Failed to load saved ratings/evidence:', err);
          if (onError) onError(err);
        })
        .getSchoolState();
    }

    // A save was refused because the school has been restored to an
    // earlier point since this page loaded. Unsaved rating changes are
    // dropped (they were made on top of the old state); the page reloads
    // the school's current state, and `afterReload` can put back anything
    // worth keeping (see saveEntryInBackground()).
    var restoreReloadCallbacks = null;
    var restoreToast = null;

    function reloadAfterRestore(afterReload) {
      if (restoreReloadCallbacks) {
        if (afterReload) restoreReloadCallbacks.push(afterReload);
        return;
      }
      restoreReloadCallbacks = afterReload ? [afterReload] : [];
      dirtyThemeIds = {};
      clearTimeout(ratingsSaveTimer);
      var toast = restoreToast || (restoreToast = createToast());
      toast.update('busy', 'Refreshing…', 'Your school’s work was restored to an earlier point.');
      loadSchoolState(function () {
        var callbacks = restoreReloadCallbacks;
        restoreReloadCallbacks = null;
        callbacks.forEach(function (cb) { cb(); });
        refreshOpenModal();
        toast.update('info', 'Your school’s work was restored to an earlier point',
          'The page has been refreshed to show it. Any changes you made just before it happened weren’t saved.', 12000);
      }, function () {
        restoreReloadCallbacks = null;
        toast.update('error', 'Couldn’t refresh', 'Your school’s work was restored to an earlier point. Reload the page to see it.');
      });
    }

    function loadSiteContent() {
      google.script.run
        .withSuccessHandler(function (content) {
          SITE_CONTENT = content || SITE_CONTENT;
          renderElementResources();
          if (typeof window.onSiteContentLoaded === 'function') window.onSiteContentLoaded();
        })
        .withFailureHandler(function (err) {
          console.error('Failed to load resources and messages:', err);
        })
        .getSiteContent();
    }

    // Exposed for Script_LoginGate.html's enterApp() to call once the
    // visitor's access record (with schoolName/email) is known.
    // -- Last Updated (banner) --------------------------------------------
    // Who made the school's latest change and when (Code.gs's
    // getSchoolState()), e.g. "Jason Ranieri 10.12.26". Loaded with the
    // school's state; this page's own saves update it straight away.
    // Other people's changes show on the next load.
    function showLastUpdated(lastUpdated) {
      var box = document.querySelector('.app-banner-updated');
      if (!box) return;
      if (!lastUpdated || !lastUpdated.at) {
        box.hidden = true;
        return;
      }
      var when = new Date(lastUpdated.at);
      box.querySelector('.app-banner-updated-value').textContent =
        (lastUpdated.name ? lastUpdated.name + ' ' : '') + formatDateDDMMYY(when);
      box.setAttribute('title', 'Last changed ' + when.toLocaleString('en-AU', {
        day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }) +
        (lastUpdated.name ? ' by ' + lastUpdated.name : ''));
      box.hidden = false;
    }

    function markUpdatedByMe() {
      showLastUpdated({ name: USER_NAME, at: Date.now() });
    }

    window.onAppEntered = function (access) {
      SCHOOL_NAME = access.schoolName || '';
      USER_EMAIL = access.email || '';
      USER_NAME = access.name || '';
      loadSchoolState();
      loadSiteContent();
      // Gives this visitor view access to their school's evidence folder,
      // so attachment links open for everyone at the school.
      google.script.run
        .withFailureHandler(function (err) { console.error('Could not confirm evidence folder access:', err); })
        .ensureSchoolFolderAccess();
    };

    // -- Autosave: Ratings -------------------------------------------------
    // Every rubric click / grade-dropdown change marks state dirty and
    // schedules a save a couple seconds later; rapid changes (clicking
    // through several rubric rows) collapse into a single save instead of
    // firing one per click. Also flushed on tab-hide/unload so a quick
    // navigation away doesn't lose an in-flight debounce window. Writes
    // are last-write-wins whole-row overwrites (see Code.gs's saveRatings
    // doc comment) — acceptable for v1 per HANDOFF.md.
    var ratingsSaveTimer = null;
    var dirtyThemeIds = {}; // themes changed since the last ratings save
    var ratingsToast = null;
    var ratingsSavesInFlight = 0;
    var ratingsSavedCallbacks = [];

    // Runs `cb` once every rating change made so far has reached the
    // server (or failed), so a checkpoint or restore (Script_History.html)
    // never races a pending save.
    function whenRatingsSaved(cb) {
      if (Object.keys(dirtyThemeIds).length) flushRatingsSave();
      if (!ratingsSavesInFlight) { cb(); return; }
      ratingsSavedCallbacks.push(cb);
    }

    function ratingsSaveSettled() {
      ratingsSavesInFlight--;
      if (ratingsSavesInFlight) return;
      var callbacks = ratingsSavedCallbacks;
      ratingsSavedCallbacks = [];
      callbacks.forEach(function (cb) { cb(); });
    }

    // -- Toasts --------------------------------------------------------------
    // Status messages stacked in the bottom-left corner, outside the Theme
    // modal, so a background evidence save keeps reporting progress (and
    // its result) after the modal is closed. Each toast is reusable:
    // update() puts it back on screen if it was dismissed or auto-hidden.
    // States: 'busy' (spinner), 'success', 'error', 'info'.
    var toastStackEl = null;

    function createToast() {
      if (!toastStackEl) {
        toastStackEl = document.createElement('div');
        toastStackEl.className = 'eia-toasts';
        toastStackEl.setAttribute('aria-live', 'polite');
        document.body.appendChild(toastStackEl);
      }
      var el = document.createElement('div');
      el.className = 'eia-toast';
      el.setAttribute('role', 'status');
      el.innerHTML =
        '<span class="eia-toast-icon" aria-hidden="true"></span>' +
        '<span class="eia-toast-text"><span class="eia-toast-title"></span><span class="eia-toast-detail"></span></span>' +
        '<button type="button" class="eia-toast-close" aria-label="Dismiss">&times;</button>';
      var titleEl = el.querySelector('.eia-toast-title');
      var detailEl = el.querySelector('.eia-toast-detail');
      var hideTimer = null;
      var removeTimer = null;

      function dismiss() {
        clearTimeout(hideTimer);
        el.classList.remove('is-visible');
        clearTimeout(removeTimer);
        removeTimer = setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 250);
      }

      function update(state, title, detail, autoHideMs) {
        clearTimeout(hideTimer);
        clearTimeout(removeTimer);
        el.className = 'eia-toast is-' + state + (el.classList.contains('is-visible') ? ' is-visible' : '');
        titleEl.textContent = title;
        detailEl.textContent = detail || '';
        detailEl.style.display = detail ? '' : 'none';
        if (!el.parentNode) toastStackEl.appendChild(el);
        void el.offsetWidth; // so the fade-in runs when (re)added
        el.classList.add('is-visible');
        if (autoHideMs) hideTimer = setTimeout(dismiss, autoHideMs);
      }

      el.querySelector('.eia-toast-close').addEventListener('click', dismiss);
      return { update: update, dismiss: dismiss };
    }

    function showRatingsToast(state, title, autoHideMs) {
      ratingsToast = ratingsToast || createToast();
      ratingsToast.update(state, title, '', autoHideMs);
    }

    function buildRatingsPayload(themeIds) {
      var payload = {};
      themeIds.forEach(function (themeId) {
        var theme = THEME_BY_ID[themeId];
        payload[themeId] = {
          grade: theme.grade,
          rubric: theme.rubric.map(function (row) { return row.selected || null; }),
          priority: !!theme.priority
        };
      });
      return payload;
    }

    // Only the themes changed since the last save are sent; Code.gs's
    // saveRatings() merges them into the school's saved ratings.
    function flushRatingsSave() {
      var themeIds = Object.keys(dirtyThemeIds);
      if (!themeIds.length || !SCHOOL_NAME) return;
      dirtyThemeIds = {};
      clearTimeout(ratingsSaveTimer);
      showRatingsToast('busy', 'Saving ratings…');
      ratingsSavesInFlight++;
      google.script.run
        .withSuccessHandler(function (result) {
          if (result && result.stale) {
            if (ratingsToast) ratingsToast.dismiss();
            reloadAfterRestore();
          } else {
            showRatingsToast('success', 'Ratings saved', 1800);
            markUpdatedByMe();
          }
          ratingsSaveSettled();
        })
        .withFailureHandler(function (err) {
          console.error('Failed to save ratings:', err);
          showRatingsToast('error', 'Ratings didn’t save — retrying');
          themeIds.forEach(function (id) { dirtyThemeIds[id] = true; });
          ratingsSaveTimer = setTimeout(flushRatingsSave, 4000);
          ratingsSaveSettled();
        })
        .saveRatings(JSON.stringify(buildRatingsPayload(themeIds)), STATE_VERSION);
    }

    function scheduleSaveRatings(theme) {
      if (!SCHOOL_NAME || !theme) return;
      dirtyThemeIds[theme.id] = true;
      clearTimeout(ratingsSaveTimer);
      ratingsSaveTimer = setTimeout(flushRatingsSave, 1500);
    }

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') flushRatingsSave();
    });
    window.addEventListener('beforeunload', flushRatingsSave);

    // =======================================================================
    // Helpers
    // =======================================================================

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function hexToRgbString(hex) {
      var n = parseInt(hex.replace('#', ''), 16);
      return ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255);
    }

    // Design language: hard-edged colour "shadow" bands (a solid box-shadow,
    // no blur — see theme-modal.css / theme-cards.css / app-banner.css) on
    // most containers/buttons, tied to whichever domain colour is already
    // in scope (--modal-accent / --card-accent), darkened a bit so the
    // shadow reads as a shadow rather than a flat duplicate of the surface
    // it's attached to. Grade-specific elements (the Grade badge) use the
    // current grade's own colour instead, darkened the same way.
    function darkenHex(hex, amount) {
      var n = parseInt(hex.replace('#', ''), 16);
      var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      r = Math.max(0, Math.round(r * (1 - amount)));
      g = Math.max(0, Math.round(g * (1 - amount)));
      b = Math.max(0, Math.round(b * (1 - amount)));
      function h(v) { return v.toString(16).padStart(2, '0'); }
      return '#' + h(r) + h(g) + h(b);
    }

    function attachmentIcon(kind) {
      var bg = kind === 'xlsx' ? '#1D8348' : (kind === 'doc' ? '#2E5AAC' : '#8a8d99');
      return '<span class="evidence-attachment-icon" style="background:' + bg + '">' +
        '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
          '<path d="M6 2h9l5 5v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" fill="#fff"/>' +
          '<path d="M15 2v5h5" fill="none" stroke="' + bg + '" stroke-width="1.3"/>' +
        '</svg></span>';
    }

    // =======================================================================
    // Outer Theme cards (below the wheel)
    // =======================================================================

    function attachmentGlyph() {
      return '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
        '<path d="M8 12.5l6.5-6.5a3 3 0 1 1 4.24 4.24L11 18a5 5 0 1 1-7.07-7.07L12 3" ' +
        'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }

    // Card fill for a grade (see GRADES and theme-cards.css).
    function gradeCardColor(grade) {
      return grade.card || grade.color;
    }

    function evidenceBadgeHtml(count) {
      return attachmentGlyph() + '<span>' + count + '</span>';
    }

    // The school-priority star: the modal's toggle, the cards' marker and
    // the priorities panel's icon. Fill and outline come from CSS.
    function starSvg() {
      return '<svg viewBox="0 0 24 24" aria-hidden="true">' +
        '<path d="M12 2.8l2.84 5.76 6.36.92-4.6 4.48 1.09 6.33L12 17.3l-5.69 2.99 1.09-6.33-4.6-4.48 6.36-.92z" ' +
        'stroke-linejoin="round"/></svg>';
    }

    // --card-accent/--card-accent-rgb (the Element's colour) aren't used by
    // the card itself any more, but openThemeModal() reads them to colour
    // the modal. `elementName` (the priorities panel only) names the
    // Element the Theme belongs to, above its title.
    function renderThemeCard(theme, idx, accentHex, accentRgb, delay, elementName) {
      var grade = GRADES[theme.grade] || GRADES.ungraded;
      var count = (theme.evidence || []).length;
      return '<div class="theme-card' + (theme.grade === 'ungraded' || !GRADES[theme.grade] ? ' is-ungraded' : '') +
          '" tabindex="0" role="button" data-theme-index="' + idx + '"' +
          ' style="--card-accent:' + accentHex + ';--card-accent-rgb:' + accentRgb +
          ';--grade-color:' + gradeCardColor(grade) + ';animation-delay:' + delay + 'ms">' +
        '<div class="theme-card-top">' +
          '<span class="theme-card-grade">' + grade.label + '</span>' +
          '<span class="theme-card-badges">' +
            '<span class="theme-card-priority" title="School priority"' + (theme.priority ? '' : ' hidden') + '>' +
              starSvg() +
            '</span>' +
            '<span class="theme-card-evidence-badge" title="' + count + ' evidence piece' + (count === 1 ? '' : 's') + '">' +
              evidenceBadgeHtml(count) +
            '</span>' +
          '</span>' +
        '</div>' +
        '<div class="theme-card-bottom">' +
          (elementName ? '<p class="theme-card-element">' + escapeHtml(elementName) + '</p>' : '') +
          '<h3 class="theme-card-title">' + escapeHtml(theme.title) + '</h3>' +
        '</div>' +
        '</div>';
    }

    var detailEl = document.getElementById('detail');
    var currentThemes = null; // the array behind whichever Element is currently shown

    function elementIconPlaceholder() {
      // Same "image placeholder" glyph style as the wheel's own wedge
      // icons — frame, dot, mountain outline — for visual consistency
      // with the other spot in the app already marked as a placeholder.
      return '<div class="element-icon-placeholder" aria-hidden="true">' +
        '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
          '<rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="1.6"/>' +
          '<circle cx="9" cy="9.5" r="2" stroke="currentColor" stroke-width="1.6"/>' +
          '<path d="M3 16.5l5.5-5 4 3.5 3-2.5L21 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
        '</svg>' +
        '</div>';
    }

    // cascadeBaseDelay: extra ms added on top of each card's own i*35ms
    // stagger, before its fade-in animation starts. Only the very first
    // Element selection (the one that also expands #detail from its
    // collapsed .is-empty width) passes this — see onSelect below — so the
    // cascade waits for that 0.4s slide to finish instead of playing while
    // the box is still narrow. Every later selection (Element switches,
    // the post-login state restore) passes nothing, so cards cascade in
    // immediately as before.
    function renderElementDetail(segment, cascadeBaseDelay) {
      var baseDelay = cascadeBaseDelay || 0;
      var data = ELEMENT_THEMES[segment.id];
      var title = (data && data.title) || segment.lines.join(' ');
      var themes = (data && data.themes) || [];
      currentThemes = themes;
      var style = ExcellenceWheel.CATEGORY_STYLE[segment.category];
      var accentHex = style.wedge;
      var accentRgb = hexToRgbString(accentHex);
      var cardsHtml = themes.map(function (t, i) {
        return renderThemeCard(t, i, accentHex, accentRgb, baseDelay + i * 35);
      }).join('');
      // The icon circle is filled with the Element's own wheel colour.
      currentSegment = segment;
      detailEl.innerHTML =
        '<div class="element-detail" style="--element-color:' + accentHex + '">' +
          elementIconPlaceholder() +
          '<h2 class="element-title">' + escapeHtml(title) + '</h2>' +
          '<div class="theme-cards">' + cardsHtml + '</div>' +
          '<div class="element-resources"></div>' +
        '</div>';
      // Resources fade in with the cards' cascade, just after the last card.
      renderElementResources(baseDelay + themes.length * 35);
    }

    // -- School priorities ------------------------------------------------
    // Any Theme can be starred as a school priority from its modal (see
    // the modal's star button). With no Element selected, the panel
    // beside the wheel lists every priority Theme under "Our School
    // Priorities", in wheel order, and the wheel lifts the Elements that
    // hold them. The "Our Priorities" button under the wheel goes back to
    // this view from any Element.
    var PRIORITIES_EMPTY_TEXT = 'Please select a theme as a priority area to display here.';

    // At most this many priority cards show at once. More go on further
    // pages, with small carousel buttons under the cards. prioritiesPage
    // is reset to the first page whenever the view is opened (see
    // onSelect and the Our Priorities button), and kept when the view is
    // only redrawn.
    var PRIORITIES_PER_PAGE = 6;
    var prioritiesPage = 0;

    // [{theme, segment}] for every priority Theme, in wheel order.
    function priorityItems() {
      var items = [];
      ExcellenceWheel.SEGMENTS.forEach(function (seg) {
        var data = ELEMENT_THEMES[seg.id];
        ((data && data.themes) || []).forEach(function (theme) {
          if (theme.priority) items.push({ theme: theme, segment: seg });
        });
      });
      return items;
    }

    // Opens #detail from its collapsed, wheel-centred starting state (see
    // .main-layout.is-empty in Index.html's <style>). It never collapses
    // again. Returns true on that first expand only: the caller then holds
    // the cards' cascade off until the 0.4s slide has finished (see the
    // matching opacity transition-delay on #detail).
    function expandDetail() {
      var mainLayout = document.querySelector('.main-layout');
      var isFirstExpand = mainLayout.classList.contains('is-empty');
      mainLayout.classList.remove('is-empty');
      return isFirstExpand;
    }

    function renderPrioritiesView(cascadeBaseDelay) {
      var baseDelay = cascadeBaseDelay || 0;
      var items = priorityItems();
      currentSegment = null; // no Element resources here
      currentThemes = items.map(function (item) { return item.theme; });
      prioritiesViewStale = false;
      var body;
      var pageCount = Math.max(1, Math.ceil(items.length / PRIORITIES_PER_PAGE));
      prioritiesPage = Math.min(Math.max(prioritiesPage, 0), pageCount - 1);
      if (items.length) {
        // Cards keep their index into currentThemes (data-theme-index),
        // so opening one works the same on every page.
        var first = prioritiesPage * PRIORITIES_PER_PAGE;
        body = '<div class="theme-cards">' + items.slice(first, first + PRIORITIES_PER_PAGE).map(function (item, j) {
          var data = ELEMENT_THEMES[item.segment.id];
          var accentHex = ExcellenceWheel.CATEGORY_STYLE[item.segment.category].wedge;
          return renderThemeCard(item.theme, first + j, accentHex, hexToRgbString(accentHex), baseDelay + j * 35,
            (data && data.title) || item.segment.lines.join(' '));
        }).join('') + '</div>' + renderPrioritiesPager(pageCount);
      } else {
        body = '<div class="priorities-empty" style="animation-delay:' + baseDelay + 'ms">' +
          '<p>' + escapeHtml(PRIORITIES_EMPTY_TEXT) + '</p>' +
          '<p class="priorities-empty-hint">Open any Theme and click the star in its top-right corner.</p>' +
        '</div>';
      }
      detailEl.innerHTML =
        '<div class="element-detail priorities-detail">' +
          '<div class="element-icon-placeholder priorities-icon" aria-hidden="true">' + starSvg() + '</div>' +
          '<h2 class="element-title">Our School Priorities</h2>' +
          body +
        '</div>';
      updatePrioritiesButton();
    }

    // Previous / page dots / next, under the priority cards. Only shown
    // when there's more than one page.
    function renderPrioritiesPager(pageCount) {
      if (pageCount < 2) return '';
      var dots = '';
      for (var k = 0; k < pageCount; k++) {
        dots += '<button type="button" class="priorities-pager-dot' + (k === prioritiesPage ? ' is-current' : '') + '"' +
          ' data-page="' + k + '" aria-label="Page ' + (k + 1) + ' of ' + pageCount + '"' +

    // -- Element resources ------------------------------------------------
    // Links from the Users spreadsheet's Resources tab (Code.gs's
    // getSiteContent()), shown as buttons under the selected Element's
    // Theme cards. A row's Element is matched to the Element's name as
    // shown in the app (ignoring case, spacing and "&" vs "and") or to its
    // wheel id.
    var currentSegment = null;

    function normaliseElementName(name) {
      return String(name || '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').trim();
    }

    function renderElementResources(delayMs) {

      if (!box || !currentSegment) return;

        normaliseElementName((data && data.title) || currentSegment.lines.join(' ')),

      ];

    // Reflects a Theme's current grade onto its outer card, live, without a
    // full re-render (which would replay the fade-in and lose the ring).
    function syncCard(cardEl, theme) {
      if (!cardEl) return;
      var g = GRADES[theme.grade] || GRADES.ungraded;
      cardEl.style.setProperty('--grade-color', gradeCardColor(g));
      cardEl.classList.toggle('is-ungraded', g === GRADES.ungraded);
      var gradeEl = cardEl.querySelector('.theme-card-grade');
      if (gradeEl) gradeEl.textContent = g.label;
      var count = (theme.evidence || []).length;
      var badge = cardEl.querySelector('.theme-card-evidence-badge');
      if (badge) {
        badge.setAttribute('title', count + ' evidence piece' + (count === 1 ? '' : 's'));
        badge.innerHTML = evidenceBadgeHtml(count);
      }
      var star = cardEl.querySelector('.theme-card-priority');
      if (star) star.hidden = !theme.priority;
      updateDotRingColors(); // this Theme's overview dot needs the same colour update
    }

    // =======================================================================
    // Theme indicator ring — the ring band between the wedges and the
    // outer dark ring, split into even slices per Element, one slice per
    // Theme, coloured by the Theme's grade. Each Element's slices are drawn
    // inside its wedge (wheel.getWedgeSlot()), so they lift with it on
    // hover and selection. Clicking one selects its Element, like the rest of the wedge.
    // Drawn with the wheel's exposed geometry (ExcellenceWheel.GEOMETRY,
    // ExcellenceWheel.roundedSectorPath) and per-segment angles (on
    // ExcellenceWheel.SEGMENTS), so it lines up with the wedges without
    // duplicating the wheel's own arc-drawing math.
    //
    // In the Our Priorities view (theme-dots.css): only the priority
    // Themes' slices lift with their wedge; every other slice stays put
    // and fades.
    // =======================================================================

    var INDICATOR_EDGE_GAP = 0.6;  // degrees inset from the wedge's own edges — matches the wheel's wedge-to-wedge gap
    var INDICATOR_SLICE_GAP = 1.2; // degrees between adjacent Theme slices within one Element
    var INDICATOR_CORNER = 6;      // softened corners, a little smaller than the wedges'

    // Ungraded reads as almost invisible here on purpose — barely off the
    // ring's white background, so the eye goes straight to what's
    // actually graded. Left as a normal visible grey everywhere else
    // (cards, grade badge, dropdown), since white-on-white there would
    // break legibility (e.g. the badge's white text).
    var INDICATOR_UNGRADED_COLOR = '#EEEFF2';

    // Built once, structure-only (every slice starts grey/"ungraded") —
    // updateDotRingColors() below is what actually paints real grades in,
    // by changing each path's own `fill` in place rather than rebuilding
    // it. That split matters: a CSS `transition: fill` (see
    // theme-dots.css) only animates a change on the SAME element: it
    // can't do anything for a freshly-inserted replacement path. The
    // real ratings for each Theme arrive from the backend a moment after
    // this initial "pop in" entrance already finished (see
    // loadSchoolState()), so this two-step split is what lets that
    // arrival read as a smooth 2s colour fade-in rather than a jump-cut.
    function buildDotRing() {
      var geo = ExcellenceWheel.GEOMETRY;
      var entrance = ExcellenceWheel.ENTRANCE;
      ExcellenceWheel.SEGMENTS.forEach(function (seg, segIdx) {
        var slot = wheel.getWedgeSlot(seg.id);
        var data = ELEMENT_THEMES[seg.id];
        var themes = (data && data.themes) || [];
        var n = themes.length;
        if (!slot || !n) return;
        var delay = entrance.indicatorStart + segIdx * entrance.indicatorStagger;
        var spanStart = seg.startAngle + INDICATOR_EDGE_GAP;
        var spanEnd = seg.endAngle - INDICATOR_EDGE_GAP;
        var sliceWidth = (spanEnd - spanStart) / n;
        var slices = '';
        for (var i = 0; i < n; i++) {
          var a0 = spanStart + i * sliceWidth + INDICATOR_SLICE_GAP / 2;
          var a1 = spanStart + (i + 1) * sliceWidth - INDICATOR_SLICE_GAP / 2;
          var d = ExcellenceWheel.roundedSectorPath(geo.R.dotRingInner, geo.R.dotRingOuter, a0, a1, INDICATOR_CORNER);
          var attrs = ' d="' + d + '" data-seg-id="' + seg.id + '" data-theme-idx="' + i + '"';
          slices += '<path class="ew-theme-indicator" fill="' + INDICATOR_UNGRADED_COLOR + '"' +
            ' style="animation-delay:' + delay + 'ms"' + attrs + '/>';
        }
        slot.innerHTML =
          '<g class="ew-theme-indicator-layer is-entering" aria-hidden="true">' + slices + '</g>';
      });
    }

    function themeForIndicator(path) {
      var data = ELEMENT_THEMES[path.getAttribute('data-seg-id')];
      return data && data.themes && data.themes[parseInt(path.getAttribute('data-theme-idx'), 10)];
    }

    // Repaints every slice's fill from ELEMENT_THEMES' current grades,
    // in place — call this (not buildDotRing()) whenever grades change
    // after the initial build: loading saved state, a rubric click, a
    // grade-dropdown change.
    function updateDotRingColors() {
      wheel.getSvgRoot().querySelectorAll('.ew-theme-indicator').forEach(function (path) {
        var theme = themeForIndicator(path);
        var grade = theme && theme.grade;
        var g = GRADES[grade] || GRADES.ungraded;
        path.setAttribute('fill', (!grade || grade === 'ungraded') ? INDICATOR_UNGRADED_COLOR : g.color);
      });
    }

    // Marks priority Themes' slices with .is-priority, which
    // theme-dots.css uses in the Our Priorities view.
    function updateDotRingPriorities() {
      wheel.getSvgRoot().querySelectorAll('.ew-theme-indicator').forEach(function (path) {
        var theme = themeForIndicator(path);
        path.classList.toggle('is-priority', !!(theme && theme.priority));
      });
    }

    // =======================================================================

                '</button>' +

    var modalBox = modalOverlay.querySelector('.theme-modal');
    var modalTitleEl = modalOverlay.querySelector('.theme-modal-title');

    var modalPriorityBtn = modalOverlay.querySelector('.theme-modal-priority');

    var rubricGridEl = modalOverlay.querySelector('.rubric-grid');
    var gradeBadgeWrap = modalOverlay.querySelector('.grade-badge-wrap');
    var gradeBadgeBtn = modalOverlay.querySelector('.grade-badge');
    var gradeBadgeText = modalOverlay.querySelector('.grade-badge-text');
    var gradeDropdownEl = modalOverlay.querySelector('.grade-dropdown');
    var evidenceListScrollEl = modalOverlay.querySelector('.evidence-list-scroll');
    var evidenceAddBtn = modalOverlay.querySelector('.evidence-add-btn');
    var evidenceComposeEl = modalOverlay.querySelector('.evidence-compose');
    var evidenceTitleInput = modalOverlay.querySelector('.evidence-compose-title');
    var evidenceTextarea = modalOverlay.querySelector('.evidence-compose-textarea');
    var evidenceComposeAttachmentsEl = modalOverlay.querySelector('.evidence-compose-attachments');
    var evidenceComposeErrorEl = modalOverlay.querySelector('.evidence-compose-error');
    var evidenceComposeNoticeEl = modalOverlay.querySelector('.evidence-compose-notice');

    var evidenceCancelBtn = modalOverlay.querySelector('.evidence-cancel-btn');
    var evidenceSubmitBtn = modalOverlay.querySelector('.evidence-submit-btn');

    var currentModalTheme = null;
    var currentModalCard = null;
    var lastFocusedEl = null;
    var composeAttachments = []; // staged for the evidence currently being composed
    var editingNumber = null;    // set while editing an existing entry; null while composing a new one

    // The level names above the rubric columns. The theme's current grade
    // isn't highlighted here: the Grade badge shows it.
    function renderRubricHeader() {
      return RUBRIC_LEVELS.map(function (key) {
        return '<div class="rubric-header-cell">' + GRADES[key].label + '</div>';
      }).join('');
    }

    function renderRubricGrid(theme) {
      var html = '';
      theme.rubric.forEach(function (row, rowIdx) {
        RUBRIC_LEVELS.forEach(function (key) {
          var cellText = row.cells[key];
          var isBlank = cellText === null || cellText === undefined || cellText === '';
          if (isBlank) {
            // No content for this level at this criterion (rare — one
            // case in the real data) — render an empty, inert cell
            // rather than "null" as text or a selectable-but-blank box.
            html += '<div class="rubric-cell is-blank" aria-hidden="true"></div>';
            return;
          }
          var isSel = row.selected === key;
          // --level-rgb tints the cell in its level's grade colour when selected.
          html += '<div class="rubric-cell' + (isSel ? ' is-selected' : '') + '" tabindex="0" role="button"' +
            ' style="--level-rgb:' + hexToRgbString(GRADES[key].color) + '"' +
            ' aria-pressed="' + isSel + '" data-row="' + rowIdx + '" data-level="' + key + '">' +
            '<span class="rubric-cell-level">' + GRADES[key].label + '</span>' +
            escapeHtml(cellText) +
            '</div>';
        });
      });
      return html;
    }

    function renderGradeDropdown(theme) {
      var keys = ['ungraded'].concat(RUBRIC_LEVELS);
      return keys.map(function (key) {
        var g = GRADES[key];
        var isCurrent = theme.grade === key;
        return '<div class="grade-dropdown-item' + (isCurrent ? ' is-current' : '') + '" data-grade="' + key +
          '" style="--item-color:' + g.color + '">' + g.label + '</div>';
      }).join('');
    }

    // Overall Grade = the average rubric level across every row that has
    // been rated (unrated rows are excluded, not counted as 0). 'ungraded'
    // if no row has been rated yet. Only runs when a rubric cell is
    // clicked — never overwrites a grade that was set via the dropdown
    // until the next rubric click.
    function computeAverageGrade(theme) {
      var indices = [];
      theme.rubric.forEach(function (row) {
        var i = RUBRIC_LEVELS.indexOf(row.selected);
        if (i >= 0) indices.push(i);
      });
      if (!indices.length) return 'ungraded';
      var avg = indices.reduce(function (a, b) { return a + b; }, 0) / indices.length;
      var rounded = Math.max(0, Math.min(RUBRIC_LEVELS.length - 1, Math.round(avg)));
      return RUBRIC_LEVELS[rounded];
    }

    // -- Evidence: accordion list ----------------------------------------
    // Numbering is a stable field on each entry (assigned once, on
    // creation), NOT derived from array/display position — so editing or
    // deleting an entry never renumbers anything else. Display is always
    // newest-number-first.
    function findEvidenceByNumber(theme, number) {
      var list = theme.evidence || [];
      for (var i = 0; i < list.length; i++) if (list[i].number === number) return list[i];
      return null;
    }

    // Entries saved before titles existed fall back to their number.
    function evidenceDisplayTitle(item) {
      return item.title || ('Evidence ' + item.number);
    }

    // Keeps whichever entry is open across re-renders (background saves
    // re-render the list); `openNumber` forces a specific entry open.
    function renderEvidenceList(theme, openNumber) {
      var openNumbers = {};
      if (openNumber !== undefined && openNumber !== null) {
        openNumbers[openNumber] = true;
      } else {
        evidenceListScrollEl.querySelectorAll('.evidence-accordion-item.is-open').forEach(function (el) {
          openNumbers[el.getAttribute('data-number')] = true;
        });
      }
      var items = (theme.evidence || []).slice().sort(function (a, b) { return (b.number || 0) - (a.number || 0); });
      if (!items.length) {
        evidenceListScrollEl.innerHTML = '<p class="evidence-empty">No evidence submitted yet.</p>';
        return;
      }
      evidenceListScrollEl.innerHTML = items.map(function (item) {
        return renderAccordionItem(item, !!openNumbers[item.number]);
      }).join('');
    }

    function renderAccordionItem(item, isOpen) {
      var attachments = item.attachments || [];
      var copying = attachments.some(function (a) { return a.pickedId; });
      var meta = [item.date]; // the attachment count is the pill beside the title
      if (item.pending) meta.push(copying ? 'Copying files…' : 'Saving…');
      else if (item.saveError) meta.push('Not saved');
      var attachmentsHtml = attachments.map(function (a) {
        var label = '<span class="evidence-attachment-name">' + escapeHtml(a.name) + '</span>' +
          attachmentIcon(a.kind || inferAttachmentKind(a.mimeType));
        var tooltip = ' title="' + escapeHtml(a.error ? a.name + ' — ' + a.error : a.name) + '"';
        if (a.url && !a.pickedId) {
          return '<a class="evidence-attachment" href="' + escapeHtml(a.url) + '" target="_blank" rel="noopener"' + tooltip + '>' + label + '</a>';
        }
        return '<div class="evidence-attachment' + (a.error ? ' is-error' : ' is-pending') + '"' + tooltip + '>' + label + '</div>';
      }).join('');
      var status = '';
      var actions;
      if (item.pending) {
        status = '<p class="evidence-item-status">' + (copying
          ? 'Copying files to your school’s evidence folder… You can keep working.'
          : 'Saving…') + '</p>';
        actions = '';
      } else if (item.saveError) {
        status = '<p class="evidence-item-status is-error">' + escapeHtml(item.saveError) + '</p>';
        var fileErrors = attachments.some(function (a) { return a.error; });
        actions =
          (fileErrors ? '' : '<button type="button" class="evidence-retry-btn" data-number="' + item.number + '">Try again</button>') +
          '<button type="button" class="evidence-edit-btn" data-number="' + item.number + '">Edit</button>' +
          '<button type="button" class="evidence-discard-btn" data-number="' + item.number + '">Discard</button>';
      } else {
        actions =
          '<button type="button" class="evidence-edit-btn" data-number="' + item.number + '">Edit</button>' +
          '<button type="button" class="evidence-delete-btn" data-number="' + item.number + '">Delete</button>';
      }
      var stateClass = item.pending ? ' is-pending' : (item.saveError ? ' is-failed' : '');
      return '<div class="evidence-accordion-item' + (isOpen ? ' is-open' : '') + stateClass + '" data-number="' + item.number + '">' +
        '<div class="evidence-accordion-header" tabindex="0" role="button" aria-expanded="' + (isOpen ? 'true' : 'false') + '">' +
          '<span class="evidence-accordion-title">' +
            '<span class="evidence-accordion-number" title="' + escapeHtml(evidenceDisplayTitle(item)) + '">' +
              escapeHtml(evidenceDisplayTitle(item)) + '</span>' +
            '<span class="evidence-accordion-meta">' + escapeHtml(meta.join(' · ')) + '</span>' +
          '</span>' +
          '<span class="evidence-accordion-pill" title="' + attachments.length + ' attachment' +
            (attachments.length === 1 ? '' : 's') + '">' + attachmentGlyph() + '<span>' + attachments.length + '</span></span>' +
          '<svg class="evidence-accordion-chevron" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">' +
            '<path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '</div>' +
        '<div class="evidence-accordion-body"><div class="evidence-accordion-body-inner">' +
          status +
          (item.text ? '<p class="evidence-item-text">' + escapeHtml(item.text) + '</p>' : '') +
          (attachmentsHtml ? '<p class="evidence-attachments-label">Attachments</p>' + attachmentsHtml : '') +
          (actions ? '<div class="evidence-item-actions">' + actions + '</div>' : '') +
        '</div></div>' +
        '</div>';
    }

    // Single-open accordion: opening one closes any other that's open.
    function toggleAccordionItem(header) {
      var item = header.closest('.evidence-accordion-item');
      var wasOpen = item.classList.contains('is-open');
      evidenceListScrollEl.querySelectorAll('.evidence-accordion-item.is-open').forEach(function (el) {
        el.classList.remove('is-open');

    // window.confirm() is silently blocked inside a sandboxed iframe
    // without allow-modals (e.g. the Artifact preview) \u2014 the call returns
    // false immediately with no dialog ever shown, which made Delete look
    // like it did nothing. Two-click in-app confirm instead: first click
    // arms it (button relabels to "Confirm?", reverts after a timeout);
    // a second click while armed actually deletes.
    var pendingDeleteNumber = null;
    var pendingDeleteTimeout = null;

    function deleteEvidence(number, btnEl) {
      if (!currentModalTheme) return;
      var target = findEvidenceByNumber(currentModalTheme, number);
      if (!target || target.pending) return;
      if (pendingDeleteNumber === number) {
        clearTimeout(pendingDeleteTimeout);
        pendingDeleteNumber = null;
        var removed = findEvidenceByNumber(currentModalTheme, number);
        currentModalTheme.evidence = (currentModalTheme.evidence || []).filter(function (e) { return e.number !== number; });
        renderEvidenceList(currentModalTheme);
        syncCard(currentModalCard, currentModalTheme);
        // An entry with no entryId was never successfully saved to the
        // backend in the first place — nothing to delete server-side.
        if (removed && removed.entryId && SCHOOL_NAME) {
          google.script.run
            .withSuccessHandler(function (result) {
              if (result && result.stale) reloadAfterRestore();
              else if (result && result.ok) markUpdatedByMe();
            })
            .withFailureHandler(function (err) { console.error('Failed to delete evidence entry:', err); })
            .deleteEvidenceEntry(removed.entryId, STATE_VERSION);
        }
        return;
      }
      pendingDeleteNumber = number;
      if (btnEl) btnEl.textContent = 'Confirm?';
      pendingDeleteTimeout = setTimeout(function () {
        pendingDeleteNumber = null;
        if (btnEl && btnEl.isConnected) btnEl.textContent = 'Delete';
      }, 2500);
    }

    evidenceListScrollEl.addEventListener('click', function (e) {
      var editBtn = e.target.closest('.evidence-edit-btn');
      if (editBtn) { startEditEvidence(parseInt(editBtn.getAttribute('data-number'), 10)); return; }
      var delBtn = e.target.closest('.evidence-delete-btn');
      if (delBtn) { deleteEvidence(parseInt(delBtn.getAttribute('data-number'), 10), delBtn); return; }
      var retryBtn = e.target.closest('.evidence-retry-btn');
      var discardBtn = e.target.closest('.evidence-discard-btn');
      if ((retryBtn || discardBtn) && currentModalTheme) {
        var failed = findEvidenceByNumber(currentModalTheme, parseInt((retryBtn || discardBtn).getAttribute('data-number'), 10));
        if (!failed || failed.pending) return;
        if (retryBtn) {
          saveEntryInBackground(currentModalTheme, currentModalCard, failed);
        } else {
          discardFailedEntry(currentModalTheme, failed);
          renderEvidenceList(currentModalTheme);
          syncCard(currentModalCard, currentModalTheme);
        }
        return;
      }
      var header = e.target.closest('.evidence-accordion-header');
      if (header) toggleAccordionItem(header);
    });
    evidenceListScrollEl.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
      var header = e.target.closest('.evidence-accordion-header');
      if (!header) return;
      e.preventDefault();
      toggleAccordionItem(header);
    });

    // -- Evidence: compose (add / edit evidence) ---------------------------
    function setEvidenceMode(mode) {
      var isCompose = mode === 'compose';
      evidenceListScrollEl.style.display = isCompose ? 'none' : '';
      evidenceAddBtn.style.display = isCompose ? 'none' : '';
      evidenceComposeEl.style.display = isCompose ? 'flex' : 'none';
    }

    // Staged attachments are either {fileId, name, mimeType, url} — already
    // in the school's evidence folder, carried over from a saved entry — or
    // {pickedId, name, mimeType} — picked in Google Picker and not copied
    // until Submit (Code.gs's saveEvidenceEntry()). A staged item with
    // `error` set failed its last copy attempt and is shown in red.
    var MAX_ATTACHMENT_BYTES = 25 * 1024 * 1024;

    function renderComposeAttachments() {
      evidenceComposeAttachmentsEl.innerHTML = composeAttachments.map(function (a, i) {
        var status = a.error || (a.pickedId ? 'Copied to your school’s evidence folder when you submit' : '');
        return '<div class="evidence-staged-attachment' + (a.error ? ' is-error' : '') + '">' +
          '<span class="evidence-staged-name" title="' + escapeHtml(a.name) + '">' +
            '<span class="evidence-staged-filename">' + escapeHtml(a.name) + '</span>' +
            (status ? '<span class="evidence-staged-status">' + escapeHtml(status) + '</span>' : '') +
          '</span>' +
          '<button type="button" class="evidence-staged-remove" data-index="' + i + '" aria-label="Remove attachment">&times;</button></div>';
      }).join('');
    }

    function inferAttachmentKind(mimeType) {
      if (mimeType && (mimeType.indexOf('spreadsheet') >= 0 || mimeType.indexOf('csv') >= 0)) return 'xlsx';
      return 'doc';
    }

    function formatDateDDMMYY(d) {
      function pad(n) { return (n < 10 ? '0' : '') + n; }
      return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + String(d.getFullYear()).slice(-2);
    }

    function showComposeError(msg) {
      evidenceComposeErrorEl.textContent = msg;
      evidenceComposeErrorEl.style.display = 'block';
    }
    function hideComposeError() {
      evidenceComposeErrorEl.style.display = 'none';
    }

    // Trusted HTML only — every dynamic string passed in is escapeHtml()'d.
    function showComposeNotice(html) {
      evidenceComposeNoticeEl.innerHTML = html;
      evidenceComposeNoticeEl.style.display = 'block';
    }
    function hideComposeNotice() {
      evidenceComposeNoticeEl.innerHTML = '';
      evidenceComposeNoticeEl.style.display = 'none';
    }

    function updateComposeSubmitLabel() {
      evidenceSubmitBtn.textContent = editingNumber !== null ? 'Save Changes' : 'Submit';
    }

    function openCompose() {
      renderComposeAttachments();
      updateComposeSubmitLabel();
      hideComposeError();
      hideComposeNotice();
      setEvidenceMode('compose');
      evidenceTitleInput.focus();
      prefetchPickerAuth();
    }

    function enterComposeMode() {
      editingNumber = null;
      composeAttachments = [];
      evidenceTitleInput.value = '';
      evidenceTextarea.value = '';
      openCompose();
    }

    function startEditEvidence(number) {
      var item = currentModalTheme && findEvidenceByNumber(currentModalTheme, number);
      if (!item || item.pending) return;
      editingNumber = number;
      composeAttachments = (item.attachments || []).map(function (a) { return Object.assign({}, a); });
      evidenceTitleInput.value = item.title || '';
      evidenceTextarea.value = item.text || '';
      openCompose();
    }

    function exitComposeMode() {
      editingNumber = null;
      composeAttachments = [];
      stopDriveAuthWait();
      hideComposeError();
      hideComposeNotice();
      setEvidenceMode('list');
    }

    evidenceAddBtn.addEventListener('click', enterComposeMode);
    evidenceCancelBtn.addEventListener('click', exitComposeMode);

    // -- Evidence: attach files via Google Picker --------------------------
    // The Picker shows the *visitor's* Drive, so it needs the visitor's own
    // OAuth token (Code.gs's getPickerAuth(); see the "Visitor Google Drive
    // authorization" section there for how that flow works). Picking only
    // stages the file; it's copied into the school's evidence folder on
    // Submit, and the evidence entry links to that copy.
    var gapiPickerLoaded = false;
    var pickerAuth = null;
    var pickerAuthAt = 0;
    var PICKER_AUTH_FRESH_MS = 5 * 60 * 1000;
    var DRIVE_AUTH_TIMEOUT_MS = 5 * 60 * 1000;
    var driveAuthPoll = null;

    function withGapiPicker(cb) {
      if (gapiPickerLoaded) { cb(); return; }
      gapi.load('picker', function () { gapiPickerLoaded = true; cb(); });
    }

    function fetchPickerAuth(cb, onError) {
      google.script.run
        .withSuccessHandler(function (auth) {
          pickerAuth = auth;
          pickerAuthAt = Date.now();
          cb(auth);
        })
        .withFailureHandler(function (err) {
          console.error('Failed to get Drive authorization:', err);
          if (onError) onError(err);
        })
        .getPickerAuth();
    }

    // Fetched as soon as compose opens, so an Attach Files click can open
    // the consent window synchronously: browsers block window.open() when
    // it happens later inside an async callback.
    function prefetchPickerAuth() {
      if (!pickerAuthIsFresh()) fetchPickerAuth(function () {});
    }

    function pickerAuthIsFresh() {
      return !!pickerAuth && Date.now() - pickerAuthAt < PICKER_AUTH_FRESH_MS;
    }

    function onAttachClick() {
      hideComposeError();
      if (driveAuthPoll) return;
      if (pickerAuthIsFresh()) {
        if (pickerAuth.authorized) openDrivePicker(pickerAuth);
        else if (pickerAuth.authError) showConnectPrompt(pickerAuth);
        else openDriveAuthWindow(pickerAuth.authorizationUrl);
        return;
      }
      evidenceAttachBtn.disabled = true;
      showComposeNotice('<p>Connecting to Google Drive…</p>');
      fetchPickerAuth(function (auth) {
        evidenceAttachBtn.disabled = false;
        hideComposeNotice();
        if (auth.authorized) openDrivePicker(auth);
        else showConnectPrompt(auth); // too late for a popup here — needs one more click
      }, function () {
        evidenceAttachBtn.disabled = false;
        hideComposeNotice();
        showComposeError('Could not connect to Google Drive. Please try again.');
      });
    }

    function showConnectPrompt(auth) {
      showComposeNotice(
        (auth.authError ? '<p class="is-error">' + escapeHtml(auth.authError) + '</p>' : '') +
        '<p>To attach files from Google Drive, allow Excellence in Action to open the files you choose. You only need to do this once.</p>' +
        '<div class="evidence-notice-actions">' +
          '<button type="button" class="evidence-notice-btn" data-action="connect">Connect Google Drive</button>' +
          '<button type="button" class="evidence-notice-btn is-secondary" data-action="dismiss">Cancel</button>' +
        '</div>');
    }

    function openDriveAuthWindow(url) {
      var popup = window.open(url, 'eia-drive-auth', 'width=520,height=680');
      if (!popup) {
        hideComposeNotice();
        showComposeError('Your browser blocked the Google sign-in window. Allow pop-ups for this site, then click Attach Files again.');
        return;
      }
      pickerAuth = null; // that authorization URL is single-use
      showComposeNotice(
        '<p>Finish connecting Google Drive in the window that just opened — this page will carry on automatically.</p>' +
        '<div class="evidence-notice-actions">' +
          '<button type="button" class="evidence-notice-btn is-secondary" data-action="dismiss">Cancel</button>' +
        '</div>');
      waitForDriveAuth(popup);
    }

    // Polls the server instead of watching popup.closed: Google's sign-in
    // pages cut the link back to this window, so `closed` can read true
    // while the window is still open.
    function waitForDriveAuth(popup) {
      stopDriveAuthWait();
      var started = Date.now();
      var inFlight = false;
      driveAuthPoll = setInterval(function () {
        if (inFlight) return;
        if (Date.now() - started > DRIVE_AUTH_TIMEOUT_MS) {
          stopDriveAuthWait();
          hideComposeNotice();
          showComposeError('Google Drive wasn’t connected. Click Attach Files to try again.');
          return;
        }
        inFlight = true;
        fetchPickerAuth(function (auth) {
          inFlight = false;
          if (!driveAuthPoll) return;
          if (auth.authorized) {
            stopDriveAuthWait();
            hideComposeNotice();
            try { popup.close(); } catch (e) { /* opener link may be severed */ }
            openDrivePicker(auth);
          } else if (auth.authError) {
            stopDriveAuthWait();
            showConnectPrompt(auth);
          }
        }, function () { inFlight = false; });
      }, 2500);
    }

    function stopDriveAuthWait() {
      if (driveAuthPoll) { clearInterval(driveAuthPoll); driveAuthPoll = null; }
    }

    function openDrivePicker(auth) {
      withGapiPicker(function () {
        var LIST = google.picker.DocsViewMode.LIST;
        function labelled(view, label) {
          if (typeof view.setLabel === 'function') view.setLabel(label);
          return view;
        }
        // Recent: every file (no folders) the visitor can open, newest
        // activity first — the quickest way to find something just made.
        var recentView = labelled(new google.picker.DocsView(google.picker.ViewId.DOCS)
          .setIncludeFolders(false)
          .setMode(LIST), 'Recent');
        // My Drive: starts at the root of the visitor's own Drive and is
        // browsed folder by folder, rather than listing every folder they
        // can access (which, school-wide, is hundreds).
        var myDriveView = labelled(new google.picker.DocsView(google.picker.ViewId.DOCS)
          .setParent('root')
          .setIncludeFolders(true)
          .setSelectFolderEnabled(false)
          .setMode(LIST), 'My Drive');
        var sharedDrivesView = labelled(new google.picker.DocsView(google.picker.ViewId.DOCS)
          .setEnableDrives(true)
          .setIncludeFolders(true)
          .setSelectFolderEnabled(false)
          .setMode(LIST), 'Shared drives');
        var builder = new google.picker.PickerBuilder()
          .setTitle('Choose evidence to attach')
          .addView(recentView)
          .addView(myDriveView)
          .addView(sharedDrivesView)
          .addView(new google.picker.DocsUploadView())
          .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
          .enableFeature(google.picker.Feature.SUPPORT_DRIVES)
          .setOAuthToken(auth.accessToken)
          .setDeveloperKey(auth.apiKey)
          // The page runs inside a *.googleusercontent.com iframe, not the
          // script.google.com URL in the address bar; Picker's own origin
          // detection gets that wrong and renders blank without this.
          .setOrigin(google.script.host.origin)
          .setCallback(onPickerPicked);
        // Required with the drive.file scope: it's what grants this app
        // access to the files the visitor picks.
        if (auth.appId) builder.setAppId(auth.appId);
        builder.build().setVisible(true);
      });
    }

    function onPickerPicked(data) {
      if (data.action !== google.picker.Action.PICKED) return;
      (data.docs || []).forEach(function (doc) {
        var already = composeAttachments.some(function (a) { return a.pickedId === doc.id; });
        if (already) return;
        var item = { pickedId: doc.id, name: doc.name, mimeType: doc.mimeType };
        if (doc.sizeBytes && Number(doc.sizeBytes) > MAX_ATTACHMENT_BYTES) {
          item.error = 'Larger than 25 MB, so it can’t be attached.';
        }
        composeAttachments.push(item);
      });
      hideComposeError();
      renderComposeAttachments();
    }

    evidenceAttachBtn.addEventListener('click', onAttachClick);
    evidenceComposeNoticeEl.addEventListener('click', function (e) {
      var btn = e.target.closest('.evidence-notice-btn');
      if (!btn) return;
      if (btn.getAttribute('data-action') === 'connect' && pickerAuth && pickerAuth.authorizationUrl) {
        openDriveAuthWindow(pickerAuth.authorizationUrl);
      } else {
        stopDriveAuthWait();
        hideComposeNotice();
      }
    });
    evidenceComposeAttachmentsEl.addEventListener('click', function (e) {
      var btn = e.target.closest('.evidence-staged-remove');
      if (!btn) return;
      // Removing an attachment that's on a saved entry archives it when the
      // edit is saved; a picked file hasn't been copied yet, so nothing to undo.
      composeAttachments.splice(parseInt(btn.getAttribute('data-index'), 10), 1);
      hideComposeError();
      renderComposeAttachments();
    });

    // -- Evidence: submit + background save --------------------------------
    // Submit closes the draft straight away and shows the entry with a
    // "Copying files…" / "Saving…" status while the server works (Code.gs's
    // saveEvidenceEntry() copies newly picked files into the school
    // folder). The server finishes even if the modal or tab is closed.
    // If it fails, nothing is saved server-side; the entry stays in the
    // list marked "Not saved" with Try again / Edit / Discard.
    var savesInFlight = 0;

    function stagedToEntryAttachment(a) {
      return a.pickedId
        ? { pickedId: a.pickedId, name: a.name, mimeType: a.mimeType }
        : { fileId: a.fileId, name: a.name, mimeType: a.mimeType, url: a.url, kind: a.kind };
    }

    function refreshEvidenceViews(theme, card) {
      if (currentModalTheme === theme && modalOverlay.classList.contains('is-open') &&
          evidenceComposeEl.style.display === 'none') {
        renderEvidenceList(theme);
      }
      syncCard(card, theme); // grade AND evidence count/icon both stay in sync
    }

    // One toast per entry, reused if it's retried or edited and saved again.
    var entryToasts = new WeakMap();

    function entryToast(entry) {
      var toast = entryToasts.get(entry);
      if (!toast) { toast = createToast(); entryToasts.set(entry, toast); }
      return toast;
    }

    function saveEntryInBackground(theme, card, entry) {
      entry.pending = true;
      entry.saveError = '';
      savesInFlight++;
      refreshEvidenceViews(theme, card);
      var toast = entryToast(entry);
      var toastDetail = '“' + evidenceDisplayTitle(entry) + '” · ' + theme.title;
      var fileCount = entry.attachments.filter(function (a) { return a.pickedId; }).length;
      toast.update('busy', fileCount
        ? 'Copying ' + fileCount + ' file' + (fileCount === 1 ? '' : 's') + ' to your school’s evidence folder…'
        : 'Saving evidence…', toastDetail);
      function toastFailed() {
        toast.update('error', 'Evidence not saved', toastDetail + ' — open this Theme to try again.');
      }
      google.script.run
        .withSuccessHandler(function (result) {
          savesInFlight--;
          entry.pending = false;
          if (result && result.stale) {
            handleStaleEntrySave(theme, card, entry, toast, toastDetail);
            return;
          }
          if (result && result.ok) {
            entry.entryId = result.entryId;
            entry.attachments = result.attachments || [];
            delete entry.lastSaved;
            markUpdatedByMe();
            // A reload after a restore may have fetched the school's state
            // before this save landed, leaving this entry out of the list.
            theme.evidence = theme.evidence || [];
            if (theme.evidence.indexOf(entry) < 0 &&
                !theme.evidence.some(function (e) { return e.entryId === entry.entryId; })) {
              theme.evidence.push(entry);
            }
            toast.update('success', fileCount
              ? 'Evidence copied to your school’s evidence folder'
              : 'Evidence saved', toastDetail, 5000);
          } else if (result && result.gone) {
            // Deleted by someone else while this was being edited: offer
            // to save it again as a new entry. Attachments that were on the
            // deleted entry are in ARCHIVE now, so only new picks carry over.
            entry.entryId = null;
            delete entry.lastSaved;
            entry.attachments = entry.attachments.filter(function (a) { return a.pickedId; });
            entry.saveError = 'This evidence was deleted by someone else, so your changes weren’t saved. Choose Try again to add it as new evidence, or Discard.';
          } else if (result && result.needsAuth) {
            pickerAuth = null;
            entry.saveError = 'Your Google Drive connection needs renewing. Choose Edit, click Attach Files to reconnect, then save again.';
          } else {
            var errorsById = {};
            ((result && result.errors) || []).forEach(function (err) { errorsById[err.pickedId] = err.error; });
            entry.attachments.forEach(function (a) { if (a.pickedId && errorsById[a.pickedId]) a.error = errorsById[a.pickedId]; });
            entry.saveError = 'Some files couldn’t be copied. Choose Edit to remove them, then save again.';
          }
          if (entry.saveError) toastFailed();
          refreshEvidenceViews(theme, card);
        })
        .withFailureHandler(function (err) {
          console.error('Failed to save evidence entry:', err);
          savesInFlight--;
          entry.pending = false;
          entry.saveError = 'Your evidence wasn’t saved. Please try again.';
          toastFailed();
          refreshEvidenceViews(theme, card);
        })
        .saveEvidenceEntry(theme.id, {
          entryId: entry.entryId || null,
          number: entry.number,
          type: entry.type,
          date: entry.date,
          title: entry.title,
          text: entry.text,
          themeTitle: theme.title,
          stateVersion: STATE_VERSION,
          attachments: entry.attachments.map(function (a) {
            return a.pickedId ? { pickedId: a.pickedId, name: a.name } : { fileId: a.fileId };
          })
        });
    }

    // The school was restored to an earlier point, so the server refused
    // this save. New evidence is kept as a "Not saved" entry (Try again
    // saves it on top of the restored state); an edit is dropped, since
    // the entry it edited may not even exist any more.
    function handleStaleEntrySave(theme, card, entry, toast, toastDetail) {
      var isNew = !entry.entryId;
      toast.update('error', 'Evidence not saved', toastDetail + (isNew
        ? ' — your school’s work was restored to an earlier point. Open this Theme to try again.'
        : ' — your school’s work was restored to an earlier point, so your changes were discarded.'));
      reloadAfterRestore(function () {
        if (!isNew) return;
        theme.evidence = theme.evidence || [];
        entry.number = theme.evidence.reduce(function (max, e) { return Math.max(max, e.number || 0); }, 0) + 1;
        entry.saveError = 'Not saved: your school’s work was restored to an earlier point while you were adding this. Choose Try again to add it now.';
        theme.evidence.push(entry);
        syncCard(card, theme);
      });
    }

    // Undoes a failed save: a never-saved entry is removed; an edit of a
    // saved entry goes back to what's actually stored.
    function discardFailedEntry(theme, entry) {
      var toast = entryToasts.get(entry);
      if (toast) toast.dismiss();
      if (entry.lastSaved) {
        entry.title = entry.lastSaved.title;
        entry.text = entry.lastSaved.text;
        entry.attachments = entry.lastSaved.attachments;
        delete entry.lastSaved;
        entry.saveError = '';
      } else {
        theme.evidence = (theme.evidence || []).filter(function (e) { return e !== entry; });
      }
    }

    window.addEventListener('beforeunload', function (e) {
      if (savesInFlight > 0) { e.preventDefault(); e.returnValue = ''; }
    });

    evidenceSubmitBtn.addEventListener('click', function () {
      if (!currentModalTheme) return;
      if (composeAttachments.some(function (a) { return a.error; })) {
        showComposeError('Remove the files marked in red before submitting.');
        return;
      }
      var title = evidenceTitleInput.value.trim();
      var text = evidenceTextarea.value.trim();
      if (!title) {
        showComposeError('Give this evidence a title before submitting.');
        evidenceTitleInput.focus();
        return;
      }
      if (!text && composeAttachments.length === 0) {
        showComposeError('Add some details or attach a file before submitting.');
        return;
      }
      var theme = currentModalTheme;
      var card = currentModalCard;
      var entry = editingNumber !== null ? findEvidenceByNumber(theme, editingNumber) : null;
      if (entry) {
        if (entry.entryId && !entry.lastSaved) {
          entry.lastSaved = { title: entry.title, text: entry.text, attachments: entry.attachments.slice() };
        }
      } else {
        entry = {
          type: 'note',
          number: (theme.evidence || []).reduce(function (max, e) { return Math.max(max, e.number || 0); }, 0) + 1,
          date: formatDateDDMMYY(new Date()),
          entryId: null
        };
        theme.evidence = theme.evidence || [];
        theme.evidence.push(entry);
      }
      entry.title = title;
      entry.text = text;
      entry.attachments = composeAttachments.map(stagedToEntryAttachment);
      exitComposeMode();
      renderEvidenceList(theme, entry.number);
      if (SCHOOL_NAME) saveEntryInBackground(theme, card, entry);
      else syncCard(card, theme);
    });

    function refreshRubricAndBadge(theme) {
      rubricHeaderEl.innerHTML = renderRubricHeader();
      rubricGridEl.innerHTML = renderRubricGrid(theme);
      var grade = GRADES[theme.grade] || GRADES.ungraded;
      gradeBadgeText.textContent = grade.label;
      gradeBadgeBtn.style.setProperty('--grade-color', grade.color); // CSS transitions the fade
      gradeBadgeBtn.style.setProperty('--grade-shadow', darkenHex(grade.color, 0.22));
      gradeDropdownEl.innerHTML = renderGradeDropdown(theme);
      refreshPriorityButton(theme);
    }

    function refreshPriorityButton(theme) {
      var on = !!theme.priority;
      modalPriorityBtn.classList.toggle('is-on', on);
      modalPriorityBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      var label = on ? 'School priority — click to remove' : 'Flag as a school priority';
      modalPriorityBtn.setAttribute('aria-label', label);
      modalPriorityBtn.setAttribute('title', label);
    }

    // After a reload re-renders the Theme cards, points the open modal at
    // the new card for its theme and redraws its rubric and evidence (a
    // draft being composed is left alone).
    function refreshOpenModal() {
      if (!currentModalTheme || !modalOverlay.classList.contains('is-open')) return;
      var idx = currentThemes ? currentThemes.indexOf(currentModalTheme) : -1;
      var card = idx >= 0 && detailEl.querySelector('.theme-card[data-theme-index="' + idx + '"]');
      if (card) currentModalCard = card;
      refreshRubricAndBadge(currentModalTheme);
      if (evidenceComposeEl.style.display === 'none') renderEvidenceList(currentModalTheme);
    }

    function openThemeModal(theme, cardEl) {
      currentModalTheme = theme;
      currentModalCard = cardEl;
      var accentHex = getComputedStyle(cardEl).getPropertyValue('--card-accent').trim();
      var accentRgb = getComputedStyle(cardEl).getPropertyValue('--card-accent-rgb').trim();
      modalBox.style.setProperty('--modal-accent', accentHex);
      modalBox.style.setProperty('--modal-accent-rgb', accentRgb);
      modalBox.style.setProperty('--modal-shadow', darkenHex(accentHex, 0.2));
      modalTitleEl.textContent = theme.title;
      refreshRubricAndBadge(theme);
      setEvidenceMode('list');
      evidenceListScrollEl.innerHTML = '';
      renderEvidenceList(theme);

      lastFocusedEl = document.activeElement;
      modalOverlay.classList.add('is-open');
      document.body.style.overflow = 'hidden';
      modalCloseBtn.focus();
    }

    function closeThemeModal() {
      modalOverlay.classList.remove('is-open');
      gradeBadgeWrap.classList.remove('is-open');
      exitComposeMode(); // discard any unsaved compose state on close
      document.body.style.overflow = '';
      if (prioritiesViewStale && isPrioritiesViewShown()) {
        // The card that opened the modal is being replaced: focus the
        // redrawn card for the same Theme, or the panel's heading if the
        // Theme was unstarred.
        var theme = currentModalTheme;
        renderPrioritiesView();
        var idx = currentThemes.indexOf(theme);
        lastFocusedEl = idx >= 0 ? detailEl.querySelector('.theme-card[data-theme-index="' + idx + '"]') : prioritiesBtn;
      }
      prioritiesViewStale = false;
      if (lastFocusedEl && typeof lastFocusedEl.focus === 'function') lastFocusedEl.focus();
    }

    // -- School priority star ---------------------------------------------
    modalPriorityBtn.addEventListener('click', function () {
      if (!currentModalTheme) return;
      currentModalTheme.priority = !currentModalTheme.priority;
      refreshPriorityButton(currentModalTheme);
      syncCard(currentModalCard, currentModalTheme);
      prioritiesChanged();
      if (isPrioritiesViewShown()) prioritiesViewStale = true;
      scheduleSaveRatings(currentModalTheme);
    });

    // -- Rubric cell selection ------------------------------------------
    // Selecting a rubric cell sets that row's rating; the Theme's overall
    // Grade recomputes as the average across every rated row (see
    // computeAverageGrade above) — this replaces whatever the Grade was
    // set to before, including a manual override, since a rubric edit is
    // a new "based on the ratings" signal.
    rubricGridEl.addEventListener('click', function (e) {
      var cell = e.target.closest('.rubric-cell');
      if (!cell || !currentModalTheme || cell.classList.contains('is-blank')) return;
      var row = parseInt(cell.getAttribute('data-row'), 10);
      var level = cell.getAttribute('data-level');
      var rowObj = currentModalTheme.rubric[row];
      rowObj.selected = (rowObj.selected === level) ? null : level; // clicking the already-selected cell clears that row
      currentModalTheme.grade = computeAverageGrade(currentModalTheme);
      refreshRubricAndBadge(currentModalTheme);
      syncCard(currentModalCard, currentModalTheme);
      scheduleSaveRatings(currentModalTheme);
    });
    rubricGridEl.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
      var cell = e.target.closest('.rubric-cell');
      if (!cell) return;
      e.preventDefault();
      cell.click();
    });

    // -- Grade badge / manual override -----------------------------------
    gradeBadgeBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      gradeBadgeWrap.classList.toggle('is-open');
    });
    gradeDropdownEl.addEventListener('click', function (e) {
      var item = e.target.closest('.grade-dropdown-item');
      if (!item || !currentModalTheme) return;
      currentModalTheme.grade = item.getAttribute('data-grade');
      gradeBadgeWrap.classList.remove('is-open');
      refreshRubricAndBadge(currentModalTheme); // rubric selections untouched; header highlight still needs refreshing
      syncCard(currentModalCard, currentModalTheme);
      scheduleSaveRatings(currentModalTheme);
    });
    document.addEventListener('click', function (e) {
      if (gradeBadgeWrap.classList.contains('is-open') && !gradeBadgeWrap.contains(e.target)) {
        gradeBadgeWrap.classList.remove('is-open');
      }
    });

    // -- Close: X button, backdrop click, Escape (dropdown first, then modal) --
    modalCloseBtn.addEventListener('click', closeThemeModal);
    modalOverlay.addEventListener('click', function (e) {
      if (e.target === modalOverlay) closeThemeModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (gradeBadgeWrap.classList.contains('is-open')) { gradeBadgeWrap.classList.remove('is-open'); return; }
      if (modalOverlay.classList.contains('is-open')) closeThemeModal();
    });

    // -- Opening a Theme card ---------------------------------------------
    function handleCardActivate(card) {
      var idx = parseInt(card.getAttribute('data-theme-index'), 10);
      var theme = currentThemes && currentThemes[idx];
      if (theme) openThemeModal(theme, card);
    }
    detailEl.addEventListener('click', function (e) {
      var card = e.target.closest('.theme-card');
      if (card) handleCardActivate(card);
    });
    detailEl.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
      var card = e.target.closest('.theme-card');
      if (card) { e.preventDefault(); handleCardActivate(card); }
    });

    // =======================================================================
    // Wheel
    // =======================================================================

    var wheel = ExcellenceWheel.create(document.getElementById('wheel-host'), {
      onSelect: function (segment) {
        // Deselecting goes back to the school's priorities. Either way the
        // panel expands from its wheel-centred starting state if it hasn't
        // already (see expandDetail()), and on that first expand the
        // cards' cascade waits for the 0.4s slide to finish.
        var isFirstExpand = expandDetail();
        if (!segment) prioritiesPage = 0;
        if (!segment) renderPrioritiesView(isFirstExpand ? 400 : 0);
        else renderElementDetail(segment, isFirstExpand ? 400 : 0);
        updatePrioritiesButton();
      }
    });

    // "Our Priorities", under the wheel: deselects any Element and shows
    // the school's priorities. Pressed while that view is showing.
    var prioritiesBtnRow = document.createElement('div');
    prioritiesBtnRow.className = 'priorities-btn-row';
    prioritiesBtnRow.innerHTML =
      '<button type="button" class="priorities-btn" aria-pressed="false">' + starSvg() + '<span>Our Priorities</span></button>';
    document.getElementById('wheel-host').appendChild(prioritiesBtnRow);
    var prioritiesBtn = prioritiesBtnRow.querySelector('.priorities-btn');

    function updatePrioritiesButton() {
      prioritiesBtn.setAttribute('aria-pressed', isPrioritiesViewShown() ? 'true' : 'false');
    }

    prioritiesBtn.addEventListener('click', function () {
      if (isPrioritiesViewShown()) return;
      wheel.deselect();
      prioritiesPage = 0;
      renderPrioritiesView(expandDetail() ? 400 : 0);
    });

    // The theme indicators go inside each wedge (see buildDotRing()).
    buildDotRing();

    // Other things you can do with the returned handle:
    // wheel.select('differentiation');
    // wheel.deselect();
    // wheel.getSelected();
</script>
