<style>
/*!
 * App banner — the header along the top of the central container
 * (#app-root in Index.html), neubrutalism style: flat white, black
 * rules and outlines, no soft shadows.
 *
 * Three columns, with the school crest truly centred however wide the
 * two sides are:
 *   - left: the "Excellence in Action" branding from the login gate
 *     ("Action" is Winter Day, embedded by Stylesheet_LoginGate);
 *   - middle: the school's crest (or its name, if it has none) — set by
 *     enterApp() in Script_LoginGate.html;
 *   - right: Last Updated, the History and Messages (bell) buttons and
 *     the avatar, whose colour enterApp() picks from the user's email.
 * The buttons' behaviour is in Script_History.html / Script_Messages.html.
 */

.app-banner {
  width: 100%;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  grid-template-areas: "brand school tools";
  align-items: center;
  gap: 16px;
  min-height: 88px;
  padding: 14px 32px;
  background: #ffffff;
  border-bottom: 2.5px solid #000000;
}

/* Branding --------------------------------------------------------------*/

.app-banner-brand {
  grid-area: brand;
  justify-self: start;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  line-height: 1;
}

.app-banner-brand-top {
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-weight: 800;
  font-size: 17px;
  color: #17458f;
}

.app-banner-brand-script {
  /* Same face and colour as the login gate's "Action". */
  font-family: 'Winter Day', 'Pacifico', 'Segoe UI', cursive;
  font-weight: 400;
  font-size: 34px;
  line-height: 0.9;
  margin: 2px 0 0 12px;
  color: #f5b400;
}

/* School ----------------------------------------------------------------*/

.app-banner-school {
  grid-area: school;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
}

/* A crest is typically landscape (~300x80) and often includes the
   school's name, so it's shown whole: contained, never cropped. */
.app-banner-school img {
  display: block;
  max-height: 54px;
  max-width: 240px;
  object-fit: contain;
}

.app-banner-school-name {
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-weight: 800;
  font-size: 16px;
  color: #000000;
  text-align: center;
}

/* School switcher (someone at several schools): the crest becomes a
   button with a chevron that opens the school dropdown (.school-menu,
   styled with the login gate). */
.app-banner-school.has-switcher {
  position: relative;
}

.app-banner-school-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 4px 8px 4px 10px;
  border: 2px solid transparent;
  border-radius: 10px;
  background: transparent;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.app-banner-school-btn:hover,
.app-banner-school-btn:focus-visible,
.app-banner-school-btn[aria-expanded="true"] {
  background: #f4f5f5;
  border-color: #000000;
  outline: none;
}

.app-banner-school-crest {
  display: flex;
  align-items: center;
}

/* Last Updated, History, avatar ------------------------------------------*/

.app-banner-tools {
  grid-area: tools;
  justify-self: end;
  display: flex;
  align-items: center;
  gap: 10px;
}

.app-banner-updated {
  margin-right: 4px;
  text-align: right;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
}

.app-banner-updated[hidden] {
  display: none;
}

.app-banner-updated-label {
  margin: 0;
  font-size: 12.5px;
  font-weight: 800;
  color: #17458f;
}

.app-banner-updated-value {
  margin: 2px 0 0;
  font-size: 10.5px;
  font-weight: 700;
  color: #8a8d99;
  white-space: nowrap;
}

/* The round History and Messages (bell) buttons, and the avatar. */
.app-banner-panel-btn,
.app-banner-avatar {
  flex: none;
  width: 46px;
  height: 46px;
  box-sizing: border-box;
  border: 2.5px solid #000000;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.app-banner-panel-btn {
  position: relative; /* for the bell's badge */
  padding: 0;
  /* Each panel button has its own bright colour (--panel-color, below)
     with a black icon. */
  background: var(--panel-color, #ffffff);
  color: #000000;
  cursor: pointer;
  transition: background-color 0.15s ease, transform 0.1s ease;
}

.app-banner-history-btn {
  --panel-color: #38b6ff;       /* sky blue */
  --panel-color-hover: #7dd0ff;
}

.app-banner-bell-btn {
  --panel-color: #ffde59;       /* bright yellow */
  --panel-color-hover: #ffe98f;
}

.app-banner-panel-btn svg {
  width: 24px;
  height: 24px;
}

.app-banner-panel-btn:hover,
.app-banner-panel-btn:focus-visible,
.app-banner-panel-btn[aria-expanded="true"] {
  background: var(--panel-color-hover, #fff6db);
  outline: none;
}

.app-banner-panel-btn:focus-visible {
  box-shadow: 0 0 0 3px #17458f;
}

.app-banner-panel-btn:active {
  transform: translateY(1px);
}

/* Unread count on the bell: active messages this person hasn't hidden. */
.app-banner-badge {
  position: absolute;
  top: -7px;
  right: -7px;
  min-width: 20px;
  height: 20px;
  box-sizing: border-box;
  padding: 0 5px;
  border: 2px solid #000000;
  border-radius: 999px;
  background: #FF5F5E;
  color: #000000;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-weight: 800;
  font-size: 11px;
  line-height: 16px;
  text-align: center;
}

.app-banner-badge[hidden] {
  display: none;
}

.app-banner-avatar {
  /* --avatar-color / --avatar-text are set per user by enterApp(). */
  background: var(--avatar-color, #24cdd6);
  color: var(--avatar-text, #ffffff);
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-weight: 800;
  font-size: 16px;
  letter-spacing: 0.3px;
}

.app-banner-avatar svg {
  width: 20px;
  height: 20px;
}

/* Small screens: branding and the round buttons on the first row; the
   crest and Last Updated on the second. The tools group dissolves
   (display: contents) so its items can be placed on the grid directly. */
@media (max-width: 640px) {
  .app-banner {
    grid-template-columns: 1fr auto auto auto;
    grid-template-areas:
      "brand  history bell    avatar"
      "school updated updated updated";
    column-gap: 8px;
    row-gap: 12px;
    padding: 12px 16px;
  }
  .app-banner-tools { display: contents; }
  .app-banner-history-btn { grid-area: history; }
  .app-banner-bell-btn { grid-area: bell; }
  .app-banner-avatar { grid-area: avatar; }
  .app-banner-updated { grid-area: updated; justify-self: end; margin-right: 0; }
  .app-banner-school { justify-content: flex-start; }
  .app-banner-school .school-menu { left: 0; transform: none; }
  .app-banner-brand-top { font-size: 14px; }
  .app-banner-brand-script { font-size: 28px; margin-left: 10px; }
  .app-banner-school img { max-height: 40px; max-width: 170px; }
  .app-banner-updated-label { font-size: 11px; }
  .app-banner-updated-value { font-size: 10px; }
  .app-banner-panel-btn,
  .app-banner-avatar { width: 40px; height: 40px; }
  .app-banner-panel-btn svg { width: 21px; height: 21px; }
  .app-banner-avatar { font-size: 14px; }
}
</style>
