<style>
/*!
 * School history (GAS build only): the History button in the banner and
 * the side panel it opens. Logic is in Script_History.html; the server
 * side is the "School history" sections of Code.gs.
 *
 * The panel slides in from the right over a dimmed backdrop, above the
 * banner and Theme modal (z-index 1100) but below the toasts (9999), so
 * restore progress stays visible. Colours follow the rest of the app:
 * navy #1c1f4f for structure, the banner's blue #2f8fd1 for checkpoints,
 * and the Delivering orange #F2994A for restores.
 */

/* Banner button ------------------------------------------------------------*/

.app-banner-history-btn {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 38px;
  padding: 0 16px 0 13px;
  margin-right: -6px; /* sits closer to the avatar than the banner's 18px gap */
  border: 1.5px solid #1c1f4f;
  border-radius: 999px;
  background: #fff;
  color: #1c1f4f;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 3px 0 0 #1c1f4f;
  transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.1s ease;
}

.app-banner-history-btn svg {
  width: 17px;
  height: 17px;
}

.app-banner-history-btn:hover,
.app-banner-history-btn:focus-visible {
  background: #f1f2f8;
  outline: none;
}

.app-banner-history-btn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 0 #1c1f4f;
}

@media (max-width: 560px) {
  .app-banner-history-btn {
    width: 36px;
    height: 36px;
    padding: 0;
    margin-right: -4px;
    justify-content: center;
  }
  .app-banner-history-label {
    display: none;
  }
}

/* Panel ------------------------------------------------------------------*/

.history-overlay {
  position: fixed;
  inset: 0;
  z-index: 1100;
  background: rgba(20, 22, 40, 0.45);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.2s ease, visibility 0s linear 0.2s;
}

.history-overlay.is-open {
  opacity: 1;
  visibility: visible;
  transition: opacity 0.2s ease;
}

.history-panel {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(440px, 100vw);
  display: flex;
  flex-direction: column;
  background: #fff;
  box-shadow: -4px 0 0 0 #1c1f4f, -16px 0 40px rgba(0, 0, 0, 0.18);
  transform: translateX(100%);
  transition: transform 0.25s ease;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  color: #2a2c38;
}

.history-overlay.is-open .history-panel {
  transform: none;
}

.history-header {
  flex: none;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 22px 22px 14px;
  border-bottom: 1px solid #eef0f5;
}

.history-title {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  color: #1c1f4f;
}

.history-subtitle {
  margin: 3px 0 0;
  font-size: 13px;
  font-weight: 600;
  color: #2f8fd1;
}

.history-close {
  flex: none;
  width: 34px;
  height: 34px;
  border: none;
  border-radius: 50%;
  background: #f1f2f6;
  color: #3d3f4a;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
}

.history-close:hover,
.history-close:focus-visible {
  background: #e4e6ee;
  outline: none;
}

.history-toolbar {
  flex: none;
  padding: 14px 22px;
  border-bottom: 1px solid #eef0f5;
}

.history-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 16px 22px 28px;
}

.history-message {
  margin: 12px 0;
  font-size: 13px;
  line-height: 1.55;
  color: #6a6d7a;
}

.history-message.is-error {
  color: #c94f4f;
}

/* Buttons */

.history-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 16px;
  border: none;
  border-radius: 9px;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
}

.history-btn:disabled {
  opacity: 0.55;
  cursor: default;
}

.history-btn.is-primary {
  background: #1c1f4f;
  color: #fff;
  box-shadow: 0 3px 0 0 #05060c;
}

.history-btn.is-primary:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: 0 1px 0 0 #05060c;
}

.history-btn.is-warning {
  background: #F2994A;
  color: #fff;
  box-shadow: 0 3px 0 0 #c46f24;
}

.history-btn.is-warning:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: 0 1px 0 0 #c46f24;
}

.history-btn.is-secondary {
  background: #eef0f5;
  color: #2a2c38;
}

.history-btn.is-secondary:hover:not(:disabled) {
  background: #e4e6ee;
}

.history-link-btn {
  padding: 0;
  border: none;
  background: none;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: #1c1f4f;
  cursor: pointer;
}

.history-link-btn:hover,
.history-link-btn:focus-visible {
  text-decoration: underline;
  outline: none;
}

.history-link-btn.is-restore {
  color: #c46f24;
}

/* Checkpoint form */

.history-checkpoint-form {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.history-checkpoint-label {
  font-size: 11px;
  font-weight: 700;
  color: #6a6d7a;
}

.history-checkpoint-input {
  width: 100%;
  box-sizing: border-box;
  border: 1.5px solid #e5e7ee;
  border-radius: 10px;
  padding: 10px 12px;
  font-family: 'Figtree', 'Segoe UI', sans-serif;
  font-size: 13px;
  color: #2a2c38;
  outline: none;
}

.history-checkpoint-input:focus {
  border-color: #2f8fd1;
}

.history-checkpoint-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* Entries */

.history-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.history-item {
  position: relative;
  display: flex;
  gap: 12px;
  padding: 0 0 18px;
}

/* The line joining one entry's icon to the next */
.history-item:not(:last-child)::before {
  content: '';
  position: absolute;
  left: 15px;
  top: 34px;
  bottom: 0;
  width: 2px;
  background: #eef0f5;
}

.history-item-icon {
  position: relative;
  flex: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #eef0f5;
  color: #1c1f4f;
}

.history-item-icon svg {
  width: 16px;
  height: 16px;
}

.history-item.kind-checkpoint .history-item-icon {
  background: #2f8fd1;
  color: #fff;
}

.history-item.kind-restore .history-item-icon {
  background: #F2994A;
  color: #fff;
}

.history-item.kind-baseline .history-item-icon {
  background: transparent;
  border: 2px dashed #c4c7d4;
  box-sizing: border-box;
}

.history-item-content {
  flex: 1 1 auto;
  min-width: 0;
  padding-top: 5px;
}

.history-item-title {
  margin: 0;
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 4px 8px;
  font-size: 13.5px;
  font-weight: 700;
  color: #2a2c38;
  overflow-wrap: anywhere;
}

.history-item.kind-checkpoint .history-item-title {
  color: #1d6fa8;
}

.history-current {
  flex: none;
  padding: 1px 8px;
  border-radius: 999px;
  background: #e6f4ec;
  color: #1E8E4F;
  font-size: 10.5px;
  font-weight: 700;
}

.history-item-meta,
.history-item-summary {
  margin: 3px 0 0;
  font-size: 12px;
  line-height: 1.45;
  color: #8a8d99;
}

.history-item-summary {
  color: #4a4d5a;
}

.history-item-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 8px;
}

/* Change details (expanded entry, and the restore preview) */

.history-changes {
  margin-top: 10px;
  padding: 10px 12px;
  border: 1px solid #eef0f5;
  border-radius: 10px;
  background: #fafbfd;
  font-size: 12px;
  line-height: 1.5;
  color: #3d3f4a;
}

.history-changes[hidden] {
  display: none;
}

.history-change-group + .history-change-group {
  margin-top: 10px;
}

.history-change-theme {
  margin: 0 0 3px;
  font-weight: 700;
  color: #1c1f4f;
}

.history-change-list {
  margin: 0;
  padding-left: 16px;
}

.history-change-list li + li {
  margin-top: 2px;
}

.history-change-note {
  margin: 8px 0 0;
  color: #8a8d99;
}

/* Restore confirmation */

.history-confirm-heading {
  margin: 4px 0 6px;
  font-size: 17px;
  font-weight: 800;
  color: #1c1f4f;
  overflow-wrap: anywhere;
}

.history-confirm-when {
  margin: 0 0 14px;
  font-size: 12.5px;
  color: #8a8d99;
}

.history-confirm-summary {
  margin: 0 0 14px;
  padding-left: 18px;
  font-size: 13px;
  line-height: 1.6;
}

.history-confirm-warning {
  margin: 0 0 16px;
  padding: 10px 12px;
  border-radius: 10px;
  background: #fff4ea;
  color: #8a4a12;
  font-size: 12.5px;
  line-height: 1.55;
}

.history-confirm-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}

.history-back {
  margin-bottom: 8px;
}

@media (prefers-reduced-motion: reduce) {
  .history-overlay,
  .history-panel {
    transition: none;
  }
}

/* Dark theme (optional) ---------------------------------------------------*/

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .history-panel {
    background: #1e2030;
    color: #d7d9ea;
  }
  :root:not([data-theme="light"]) .history-title,
  :root:not([data-theme="light"]) .history-item-title,
  :root:not([data-theme="light"]) .history-confirm-heading,
  :root:not([data-theme="light"]) .history-change-theme,
  :root:not([data-theme="light"]) .history-link-btn {
    color: #eef0ff;
  }
  :root:not([data-theme="light"]) .history-header,
  :root:not([data-theme="light"]) .history-toolbar {
    border-color: #2c2e42;
  }
  :root:not([data-theme="light"]) .history-close,
  :root:not([data-theme="light"]) .history-btn.is-secondary,
  :root:not([data-theme="light"]) .history-item.kind-auto .history-item-icon {
    background: #2c2e42;
    color: #d7d9ea;
  }
  :root:not([data-theme="light"]) .history-changes,
  :root:not([data-theme="light"]) .history-checkpoint-input {
    background: #262838;
    border-color: #34364a;
    color: #c7c9db;
  }
  :root:not([data-theme="light"]) .history-item:not(:last-child)::before {
    background: #2c2e42;
  }
  :root:not([data-theme="light"]) .history-item-summary {
    color: #c7c9db;
  }
}
:root[data-theme="dark"] .history-panel {
  background: #1e2030;
  color: #d7d9ea;
}
:root[data-theme="dark"] .history-title,
:root[data-theme="dark"] .history-item-title,
:root[data-theme="dark"] .history-confirm-heading,
:root[data-theme="dark"] .history-change-theme,
:root[data-theme="dark"] .history-link-btn {
  color: #eef0ff;
}
:root[data-theme="dark"] .history-header,
:root[data-theme="dark"] .history-toolbar {
  border-color: #2c2e42;
}
:root[data-theme="dark"] .history-close,
:root[data-theme="dark"] .history-btn.is-secondary,
:root[data-theme="dark"] .history-item.kind-auto .history-item-icon {
  background: #2c2e42;
  color: #d7d9ea;
}
:root[data-theme="dark"] .history-changes,
:root[data-theme="dark"] .history-checkpoint-input {
  background: #262838;
  border-color: #34364a;
  color: #c7c9db;
}
:root[data-theme="dark"] .history-item:not(:last-child)::before {
  background: #2c2e42;
}
:root[data-theme="dark"] .history-item-summary {
  color: #c7c9db;
}
</style>
