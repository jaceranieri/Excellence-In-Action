<script>
  // ACCESS is embedded by Index.html from the server-side
  // getCurrentUserAccess() lookup (see Code.gs) — already resolved
  // before this script runs, so no round trip is needed here.
  //   { email, found, active, name, schoolName, crestUrl, schools, lastSchool }
  // `schools` lists every school they're active at (someone can be at
  // several); with more than one, they pick which to open.

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // -- School dropdown ---------------------------------------------------
  // For someone at several schools: a menu of their schools, each with its
  // crest, opened from `trigger`. Used on the welcome screen and by the
  // banner's school switcher. `opts`:
  //   current   the school now open (ticked), if any
  //   lastUsed  the school they opened last time (tagged "Last used")
  //   onPick(school)  called with the chosen {schoolName, crestUrl}
  var CHEVRON_SVG = '<svg class="school-menu-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
    '<path d="M6 9.5l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function schoolCrestHtml(school, cls) {
    return school.crestUrl
      ? '<img class="' + cls + '" src="' + escapeHtml(school.crestUrl) + '" alt="">'
      : '';
  }

  var schoolMenuCount = 0;

  function createSchoolMenu(trigger, schools, opts) {
    var wrap = trigger.parentNode;
    var menu = document.createElement('div');
    menu.className = 'school-menu';
    menu.id = 'school-menu-' + (++schoolMenuCount);
    menu.setAttribute('role', 'menu');
    menu.hidden = true;
    menu.innerHTML = schools.map(function (school, i) {
      var isCurrent = opts.current && school.schoolName === opts.current;
      var isLast = !opts.current && opts.lastUsed && school.schoolName === opts.lastUsed;
      return '<button type="button" class="school-menu-item' + (isCurrent ? ' is-current' : '') + '" role="menuitem" data-idx="' + i + '"' +
          (isCurrent ? ' aria-current="true"' : '') + '>' +
          '<span class="school-menu-crest-box">' + schoolCrestHtml(school, 'school-menu-crest') + '</span>' +
          '<span class="school-menu-name">' + escapeHtml(school.schoolName) + '</span>' +
          (isCurrent ? '<span class="school-menu-tag">Current</span>' : '') +
          (isLast ? '<span class="school-menu-tag">Last used</span>' : '') +
        '</button>';
    }).join('');
    wrap.appendChild(menu);
    // A crest that fails to load leaves just the name.
    Array.prototype.forEach.call(menu.querySelectorAll('img'), function (img) {
      img.addEventListener('error', function () { img.remove(); });
    });
    trigger.setAttribute('aria-haspopup', 'true');
    trigger.setAttribute('aria-expanded', 'false');
    trigger.setAttribute('aria-controls', menu.id);

    function items() { return Array.prototype.slice.call(menu.querySelectorAll('.school-menu-item')); }
    function open() {
      menu.hidden = false;
      trigger.setAttribute('aria-expanded', 'true');
      var first = menu.querySelector('.school-menu-item.is-current') || items()[0];
      if (first) first.focus();
    }
    function close(focusTrigger) {
      if (menu.hidden) return;
      menu.hidden = true;
      trigger.setAttribute('aria-expanded', 'false');
      if (focusTrigger) trigger.focus();
    }
    trigger.addEventListener('click', function () {
      if (menu.hidden) open(); else close(false);
    });
    menu.addEventListener('click', function (e) {
      var item = e.target.closest('.school-menu-item');
      if (!item) return;
      close(false);
      opts.onPick(schools[parseInt(item.getAttribute('data-idx'), 10)]);
    });
    menu.addEventListener('keydown', function (e) {
      var list = items();
      var i = list.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { e.preventDefault(); list[(i + 1) % list.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); list[(i - 1 + list.length) % list.length].focus(); }
      else if (e.key === 'Escape') { e.preventDefault(); close(true); }
      else if (e.key === 'Tab') close(false);
    });
    document.addEventListener('click', function (e) {
      if (!wrap.contains(e.target)) close(false);
    });
    return { open: open, close: close };
  }

  function renderLoginGateFound(access) {
    if (access.schools && access.schools.length > 1) {
      renderLoginGateChooseSchool(access);
      return;
    }
    var card = document.getElementById('login-gate-card');
    var schoolLabel = access.schoolName || 'your school';
    // The crest image itself carries the school's name (per the actual
    // crest artwork), so the button shows only the crest — no redundant
    // text label — but keeps an aria-label/alt for screen readers.
    card.innerHTML =
      '<h2 class="login-gate-card-heading">Welcome, ' + escapeHtml(access.name || 'there') + '!</h2>' +
      '<p class="login-gate-card-sub">Your School’s EIA Tool has been found.<br>Click the button below to get started!</p>' +
      '<button type="button" class="login-gate-continue" id="login-gate-continue-btn" aria-label="Continue to ' + escapeHtml(schoolLabel) + '">' +
        (access.crestUrl
          ? '<img class="login-gate-continue-crest" src="' + escapeHtml(access.crestUrl) + '" alt="' + escapeHtml(schoolLabel) + '">'
          : '<span class="login-gate-continue-school">' + escapeHtml(schoolLabel) + '</span>') +
      '</button>';
    document.getElementById('login-gate-continue-btn').addEventListener('click', function () { enterApp(); });
  }

  // Several schools: the button opens a dropdown of their crests, and
  // picking one opens that school.
  function renderLoginGateChooseSchool(access) {
    var card = document.getElementById('login-gate-card');
    card.innerHTML =
      '<h2 class="login-gate-card-heading">Welcome, ' + escapeHtml(access.name || 'there') + '!</h2>' +
      '<p class="login-gate-card-sub">You have access to ' + access.schools.length + ' schools’ EIA Tools.<br>Choose a school to get started!</p>' +
      '<div class="school-picker">' +
        '<button type="button" class="login-gate-continue login-gate-choose" id="login-gate-continue-btn">' +
          '<span class="login-gate-choose-label">Choose your school</span>' + CHEVRON_SVG +
        '</button>' +
      '</div>';
    createSchoolMenu(document.getElementById('login-gate-continue-btn'), access.schools, {
      lastUsed: access.lastSchool,
      onPick: function (school) { enterApp(school); }
    });
  }

  function renderLoginGateInsufficient(access) {
    var card = document.getElementById('login-gate-card');
    var greeting = access.name ? 'Welcome, ' + escapeHtml(access.name) + '!' : 'Welcome!';
    var schoolLine = access.schoolName
      ? '<p class="login-gate-school-plain">' + escapeHtml(access.schoolName) + '</p>'
      : '';
    card.innerHTML =
      '<h2 class="login-gate-card-heading">' + greeting + '</h2>' +
      schoolLine +
      '<div class="login-gate-insufficient" role="note" aria-disabled="true">' +
        '<span class="login-gate-insufficient-title">Insufficient Access</span>' +
        '<span class="login-gate-insufficient-sub">Request Access from your Principal</span>' +
      '</div>';
  }

  // "Jason Ranieri" -> "JR"; a single-word name just uses its first
  // letter. Falls back to an empty string (leaving the avatar's
  // existing placeholder icon in place) if there's nothing to work with.
  function initialsFor(name) {
    var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '';
    if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
    return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
  }

  // Bright avatar colours, each with the text colour that reads on it.
  var AVATAR_COLOURS = [
    { bg: '#24CDD6', text: '#ffffff' }, // teal
    { bg: '#FF66C4', text: '#ffffff' }, // pink
    { bg: '#8C52FF', text: '#ffffff' }, // purple
    { bg: '#38B6FF', text: '#ffffff' }, // sky blue
    { bg: '#FF914D', text: '#ffffff' }, // orange
    { bg: '#7ED957', text: '#000000' }, // lime
    { bg: '#FFDE59', text: '#000000' }, // yellow
    { bg: '#FF5757', text: '#ffffff' }  // red
  ];

  // The same colour for a person on every visit: picked from their email.
  function avatarColourFor(email) {
    var hash = 0;
    var s = String(email || '').toLowerCase();
    for (var i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
    return AVATAR_COLOURS[hash % AVATAR_COLOURS.length];
  }

  // Swap the login gate for the real app: this is also where the
  // banner picks up the signed-in user's real school/crest/name,
  // replacing the placeholders documented in app-banner.css/README as
  // "will come from the roster/session lookup once auth is wired up" —
  // that lookup is exactly what getCurrentUserAccess() now is.
  // The banner's school: its crest (which usually includes its name), or
  // just its name if it has none, or if the crest image fails to load.
  // For someone at several schools it's also a button that opens a
  // dropdown to switch school (window.switchSchool() in Script_App.html).
  window.renderBannerSchool = function (access) {
    var schoolEl = document.querySelector('.app-banner-school');
    if (!schoolEl) return;
    var nameHtml = '<span class="app-banner-school-name">' + escapeHtml(access.schoolName || '') + '</span>';
    var crestHtml = access.crestUrl
      ? '<img src="' + escapeHtml(access.crestUrl) + '" alt="' + escapeHtml(access.schoolName || '') + '">'
      : nameHtml;
    var several = access.schools && access.schools.length > 1;
    schoolEl.classList.toggle('has-switcher', !!several);
    schoolEl.innerHTML = several
      ? '<button type="button" class="app-banner-school-btn" aria-label="' + escapeHtml(access.schoolName || '') +
          ' — switch school" title="Switch school">' +
          '<span class="app-banner-school-crest">' + crestHtml + '</span>' + CHEVRON_SVG +
        '</button>'
      : crestHtml;
    var img = schoolEl.querySelector('img');
    if (img) {
      img.addEventListener('error', function () {
        var box = schoolEl.querySelector('.app-banner-school-crest');
        if (box) box.innerHTML = nameHtml; else schoolEl.innerHTML = nameHtml;
      });
    }
    if (several) {
      createSchoolMenu(schoolEl.querySelector('.app-banner-school-btn'), access.schools, {
        current: access.schoolName,
        onPick: function (school) {
          if (typeof window.switchSchool === 'function') window.switchSchool(school);
        }
      });
    }
  };

  // `school` is the one picked from the welcome screen's dropdown; with a
  // single school it's left out.
  function enterApp(school) {
    var access = window.__ACCESS__;
    if (school) {
      access.schoolName = school.schoolName;
      access.crestUrl = school.crestUrl;
    }
    window.renderBannerSchool(access);

    var avatarEl = document.querySelector('.app-banner-avatar');
    var initials = initialsFor(access.name);
    if (avatarEl) {
      var colour = avatarColourFor(access.email);
      avatarEl.style.setProperty('--avatar-color', colour.bg);
      avatarEl.style.setProperty('--avatar-text', colour.text);
    }
    if (avatarEl && initials) {
      avatarEl.textContent = initials;
      avatarEl.setAttribute('title', access.name);
      avatarEl.removeAttribute('aria-hidden');
      avatarEl.setAttribute('role', 'img');
      avatarEl.setAttribute('aria-label', access.name);
    }

    document.getElementById('login-gate').hidden = true;
    document.getElementById('app-root').hidden = false;

    // Defined in Script_App.html — loads this school's saved
    // ratings/evidence from the backend and merges them into
    // ELEMENT_THEMES now that we know which school this visitor is.
    if (typeof window.onAppEntered === 'function') window.onAppEntered(access);
  }

  (function initLoginGate() {
    var access = window.__ACCESS__ || { email: '', found: false, active: false };
    if (access.found && access.active) {
      renderLoginGateFound(access);
    } else {
      renderLoginGateInsufficient(access);
    }
  })();
</script>
