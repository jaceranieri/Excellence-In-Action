<script>
  // ACCESS is embedded by Index.html from the server-side
  // getCurrentUserAccess() lookup (see Code.gs) — already resolved
  // before this script runs, so no round trip is needed here.
  //   { email, found, active, name, schoolName, crestUrl }

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderLoginGateFound(access) {
    var card = document.getElementById('login-gate-card');
    var schoolLabel = access.schoolName || 'your school';
    // The crest image itself carries the school's name (per the actual
    // crest artwork), so the button shows only the crest — no redundant
    // text label — but keeps an aria-label/alt for screen readers.
    card.innerHTML =
      '<h2 class="login-gate-card-heading">Welcome, ' + escapeHtml(access.name || 'there') + '!</h2>' +
      '<p class="login-gate-card-sub">Your School’s EIA Tool has been found.<br>Click the button below to get started!</p>' +
      '<button type="button" class="login-gate-continue" id="login-gate-continue-btn" aria-label="Continue to ' + escapeHtml(schoolLabel) + '">' +
        (access.crestUrl
          ? '<img class="login-gate-continue-crest" src="' + escapeHtml(access.crestUrl) + '" alt="' + escapeHtml(schoolLabel) + '">'
          : '<span class="login-gate-continue-school">' + escapeHtml(schoolLabel) + '</span>') +
      '</button>';
    document.getElementById('login-gate-continue-btn').addEventListener('click', enterApp);
  }

  function renderLoginGateInsufficient(access) {
    var card = document.getElementById('login-gate-card');
    var greeting = access.name ? 'Welcome, ' + escapeHtml(access.name) + '!' : 'Welcome!';
    var schoolLine = access.schoolName
      ? '<p class="login-gate-school-plain">' + escapeHtml(access.schoolName) + '</p>'
      : '';
    card.innerHTML =
      '<h2 class="login-gate-card-heading">' + greeting + '</h2>' +
      schoolLine +
      '<div class="login-gate-insufficient" role="note" aria-disabled="true">' +
        '<span class="login-gate-insufficient-title">Insufficient Access</span>' +
        '<span class="login-gate-insufficient-sub">Request Access from your Principal</span>' +
      '</div>';
  }

  // "Jason Ranieri" -> "JR"; a single-word name just uses its first
  // letter. Falls back to an empty string (leaving the avatar's
  // existing placeholder icon in place) if there's nothing to work with.
  function initialsFor(name) {
    var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '';
    if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
    return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
  }

  // Bright avatar colours, each with the text colour that reads on it.
  var AVATAR_COLOURS = [
    { bg: '#24CDD6', text: '#ffffff' }, // teal
    { bg: '#FF66C4', text: '#ffffff' }, // pink
    { bg: '#8C52FF', text: '#ffffff' }, // purple
    { bg: '#38B6FF', text: '#ffffff' }, // sky blue
    { bg: '#FF914D', text: '#ffffff' }, // orange
    { bg: '#7ED957', text: '#000000' }, // lime
    { bg: '#FFDE59', text: '#000000' }, // yellow
    { bg: '#FF5757', text: '#ffffff' }  // red
  ];

  // The same colour for a person on every visit: picked from their email.
  function avatarColourFor(email) {
    var hash = 0;
    var s = String(email || '').toLowerCase();
    for (var i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
    return AVATAR_COLOURS[hash % AVATAR_COLOURS.length];
  }

  // Swap the login gate for the real app: this is also where the
  // banner picks up the signed-in user's real school/crest/name,
  // replacing the placeholders documented in app-banner.css/README as
  // "will come from the roster/session lookup once auth is wired up" —
  // that lookup is exactly what getCurrentUserAccess() now is.
  function enterApp() {
    var access = window.__ACCESS__;
    // The school's crest (which usually includes its name), or just its
    // name if it has none, or if the crest image fails to load.
    var schoolEl = document.querySelector('.app-banner-school');
    if (schoolEl) {
      var nameHtml = '<span class="app-banner-school-name">' + escapeHtml(access.schoolName || '') + '</span>';
      if (access.crestUrl) {
        schoolEl.innerHTML = '<img src="' + escapeHtml(access.crestUrl) + '" alt="' + escapeHtml(access.schoolName || '') + '">';
        schoolEl.querySelector('img').addEventListener('error', function () { schoolEl.innerHTML = nameHtml; });
      } else {
        schoolEl.innerHTML = nameHtml;
      }
    }

    var avatarEl = document.querySelector('.app-banner-avatar');
    var initials = initialsFor(access.name);
    if (avatarEl) {
      var colour = avatarColourFor(access.email);
      avatarEl.style.setProperty('--avatar-color', colour.bg);
      avatarEl.style.setProperty('--avatar-text', colour.text);
    }
    if (avatarEl && initials) {
      avatarEl.textContent = initials;
      avatarEl.setAttribute('title', access.name);
      avatarEl.removeAttribute('aria-hidden');
      avatarEl.setAttribute('role', 'img');
      avatarEl.setAttribute('aria-label', access.name);
    }

    document.getElementById('login-gate').hidden = true;
    document.getElementById('app-root').hidden = false;

    // Defined in Script_App.html — loads this school's saved
    // ratings/evidence from the backend and merges them into
    // ELEMENT_THEMES now that we know which school this visitor is.
    if (typeof window.onAppEntered === 'function') window.onAppEntered(access);
  }

  (function initLoginGate() {
    var access = window.__ACCESS__ || { email: '', found: false, active: false };
    if (access.found && access.active) {
      renderLoginGateFound(access);
    } else {
      renderLoginGateInsufficient(access);
    }
  })();
</script>
