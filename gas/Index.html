<style>
  :root { color-scheme: light; }

  /* Different Elements have different numbers of Theme cards, so the
     page's total height changes on every selection — right around the
     point where that height crosses the viewport's own height, the
     browser's vertical scrollbar appears/disappears, which shifts the
     horizontal centring of the whole body (banner included) by half a
     scrollbar-width. Reserving that space permanently stops the jump. */
  html {
    overflow-y: scroll;
    scrollbar-gutter: stable;
  }
  body {
    margin: 0;
    min-height: 100vh;
    box-sizing: border-box;
    padding: 32px;
    background: #f4f5f7;
    font-family: 'Figtree', 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* #app-root wraps the banner + wheel/cards row (see Script_LoginGate's
     enterApp(), which un-hides it). It MUST be a flex column itself,
     not a plain block: a plain block's children (the banner especially,
     which has no margin:auto of its own) just left-align inside it
     instead of centering — that was a real bug, not a hypothetical one,
     causing the banner to visibly sit off-centre relative to the row
     below it. Also fills the rest of the viewport's height (flex: 1 1
     auto, body being the only other flex item besides the position:
     fixed login gate) so .stage-area below has real room to vertically
     centre the wheel+cards row within. */
  #app-root {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    flex: 1 1 auto;
    gap: 40px; /* guaranteed minimum space between the banner and the centred row below, however that row is vertically positioned */
  }
  /* #app-root's own `display: flex` above is an author rule and would
     otherwise beat the browser's default `[hidden] { display: none }`
     at equal specificity — same fix as .login-gate needed earlier. */
  #app-root[hidden] {
    display: none;
  }

  /* Vertically centres the wheel+cards row within whatever space is
     left below the banner (not the whole page — the banner stays put
     at its natural size via #app-root's own flex column above). The
     40px gap on #app-root is still respected as a floor even when
     there's plenty of room to centre within. */
  .stage-area {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Wheel + Theme cards, side by side, with real breathing room between
     them (44-56px depending on tier below) — not literally zero as in
     a previous pass, which read as cramped; the earlier "no padding on
     the right of the wheel" note meant not to ALSO add box-level
     padding on top of this gap, not to remove the gap entirely.
     Every size below is a fixed pixel value per tier, not a percentage,
     vw, or flex-grow ratio — nothing here is ever computed from the
     sibling or from how many Theme cards are showing, which is what
     actually stops both the wheel and the cards from changing size
     depending on which Element is selected. It's also deliberately NOT
     continuously fluid: rather than smoothly resizing on every pixel
     of window width (which made Theme cards subtly different widths
     at almost every screen size), the layout snaps between a small
     number of fully fixed, designed sizes at the breakpoints below. */
  .main-layout {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 56px;
    /* Explicit, not left to shrink-to-fit: without this, the stacked
       tier's min(…, 100%) widths below have no definite container to
       resolve their 100% against (.main-layout would otherwise size
       itself from its own children, which is exactly the same
       content-dependent circularity that caused the wheel to change
       size before, just relocated to a different tier). */
    width: 100%;
    /* Fixed to #wheel-host's own height, not left to auto (which would
       resolve to whichever child is tallest). #detail's height varies
       with how many Theme-card rows an Element has — left auto, that
       made .stage-area's vertical centring (based on .main-layout's
       own box) shift the WHEEL up and down every time a different
       Element's card count crossed a row boundary, even though the
       wheel's own size never changed. Pinning this to the wheel's
       height, with overflow left visible (the default), decouples
       that: taller card content just extends past the box's bottom
       uneventfully instead of resizing the box centring is based on. */
    height: 580px;
    transition: gap 0.4s ease;
  }
  #wheel-host {
    flex: none;
    width: 580px;
    /* Overrides excellence-wheel.css's own .ew-host { margin: 0 auto }
       (added by the component itself via the ew-host class) — auto
       margins on a flex item absorb ALL the row's leftover space into
       themselves rather than letting .main-layout's justify-content:
       center centre the wheel+cards pair as a group. That's what was
       actually pushing the cards far to the right on a wide screen:
       the wheel was quietly consuming the entire leftover width as its
       own left+right margin instead of sharing it symmetrically. */
    margin: 0;
  }
  #detail {
    flex: none;
    width: 580px;
    min-height: 90px;
    box-sizing: border-box;
    overflow: hidden; /* only actually clips anything during the collapsed (.is-empty) state below — #detail's own height is otherwise auto/content-driven, so nothing here is ever cut off */
    transition: width 0.4s ease, opacity 0.3s ease, min-height 0.4s ease;
  }
  #detail .placeholder { color: #999; font-style: italic; margin: 0; text-align: center; }

  /* Before the first Element is ever selected, the wheel sits alone,
     centred on the whole row (#detail collapsed to nothing) — once
     Script_App.html's onSelect removes this class on the first real
     selection, #detail expands and the transitions above animate the
     wheel sliding left into its permanent side-by-side position. It
     never reverts, even if the user later deselects. */
  .main-layout.is-empty { gap: 0; }
  .main-layout.is-empty #detail {
    width: 0;
    min-width: 0;
    min-height: 0;
    opacity: 0;
  }

  /* Compact tier: smaller laptops / tablets in landscape. Still fully
     fixed, still side by side — just a smaller designed size, not a
     scaled-down version of the desktop numbers above. */
  @media (max-width: 1279.98px) {
    .main-layout { gap: 32px; height: 380px; }
    #wheel-host { width: 380px; }
    #detail { width: 380px; }
  }

  /* Stacked tier: too narrow for both fixed columns side by side.
     min(…, 100%) on both is the one deliberate exception to "always
     fixed" in this layout — a safety net against horizontal overflow
     on genuinely small phone screens, not a return to fluid scaling.
     height reverts to auto here since the column stacks wheel+cards
     cumulatively rather than side by side. */
  @media (max-width: 899.98px) {
    .main-layout { flex-direction: column; align-items: center; gap: 32px; height: auto; }
    #wheel-host { width: min(360px, 100%); }
    #detail { width: min(420px, 100%); }
  }
</style>
